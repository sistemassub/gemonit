<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEMONIT · Governança do Monitoramento</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<meta name="theme-color" content="#009E3C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: menu lateral curto + área de trabalho. O centro do sistema é o espaço de análise do órgão (lista de entregas | entrega aberta). */
:root{
  --brand:#0B2350; --brand-2:#14366F; --accent:#2563C9; --accent-2:#3B82F6; --accent-soft:#E8F0FD;
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#11203B; --muted:#56678A; --faint:#8592AB; --line:#DCE3EE; --line-2:#EAEFF6;
  --ok:#11845F; --ok-soft:#E2F4EC; --warn:#B26A00; --warn-soft:#FFF1D9; --crit:#C73636; --crit-soft:#FCE7E7;
  --info:#2563C9; --info-soft:#E8F0FD; --vio:#6547D6; --vio-soft:#EEEAFD; --gray:#68768E; --gray-soft:#EDF0F5;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --display:"Sora","IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(16,35,70,.05),0 6px 18px rgba(16,35,70,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#08183A; --brand-2:#123063; --accent:#6C9BF0; --accent-2:#8DB3F7; --accent-soft:#1A2C50;
  --bg:#0D1524; --surface:#141F35; --surface-2:#18253F; --ink:#E6ECF7; --muted:#A3B0C8; --faint:#7886A2; --line:#26375A; --line-2:#1F2E4B;
  --ok:#3FC79D; --ok-soft:#15362D; --warn:#F0B04A; --warn-soft:#3A2D14; --crit:#F07575; --crit-soft:#3E1D22;
  --info:#6C9BF0; --info-soft:#1A2C50; --vio:#A893F5; --vio-soft:#2A2550; --gray:#9AA6BC; --gray-soft:#22304A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --brand:#08183A; --brand-2:#123063; --accent:#6C9BF0; --accent-2:#8DB3F7; --accent-soft:#1A2C50;
  --bg:#0D1524; --surface:#141F35; --surface-2:#18253F; --ink:#E6ECF7; --muted:#A3B0C8; --faint:#7886A2; --line:#26375A; --line-2:#1F2E4B;
  --ok:#3FC79D; --ok-soft:#15362D; --warn:#F0B04A; --warn-soft:#3A2D14; --crit:#F07575; --crit-soft:#3E1D22;
  --info:#6C9BF0; --info-soft:#1A2C50; --vio:#A893F5; --vio-soft:#2A2550; --gray:#9AA6BC; --gray-soft:#22304A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
/* menu */
.side{background:var(--brand);color:#D3DFF5;display:flex;flex-direction:column;overflow:auto}
.brandbox{padding:20px 18px 16px;display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,#4C8DF6,#1D4FB8);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(37,99,201,.45)}
.brandbox b{display:block;color:#fff;font-family:var(--display);font-size:14px;line-height:1.2}
.brandbox small{color:#93AAD6;font-size:11.5px}
.nav{padding:4px 10px 16px;display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:#7690C2;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#D3DFF5;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(91,149,245,.18);color:#fff;box-shadow:inset 3px 0 0 #5B95F5}
.nav a svg{opacity:.85;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}
.nav .cnt.al{background:#D9534F;color:#fff}
.sidefoot{margin-top:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.sidefoot .help{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;font-size:12px;color:#B9CAE8}
.sidefoot .help b{color:#fff;display:block;margin-bottom:4px;font-size:12.5px}
.sidefoot button{background:none;border:1px solid rgba(255,255,255,.18);color:#D3DFF5;border-radius:8px;padding:7px 9px;cursor:pointer;font-size:12px;text-align:left}
.sidefoot button:hover{background:rgba(255,255,255,.07)}
.sidefoot .help button{margin-top:8px;width:100%;background:#2563C9;border-color:#2563C9;color:#fff;font-weight:600;text-align:center}
/* topo */
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumbs{font-size:12px;color:var(--muted)}
.crumbs a{color:var(--muted);text-decoration:none}.crumbs a:hover{color:var(--accent)}
.ptitle{font-size:18px;font-weight:600;margin:0}
.top .grow{flex:1;min-width:10px}
.cmdk{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--faint);cursor:pointer;min-width:260px}
.cmdk:hover{border-color:var(--accent)}
.cmdk kbd{margin-left:auto;font-size:10.5px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:var(--mono)}
.cyc,.usr{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cyc select,.usr select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:inline-grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.content{overflow:auto;padding:22px 24px 70px;flex:1}
.wrap{max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
/* blocos */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-h .sub{color:var(--muted);font-size:12.5px}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:1.35fr 1fr}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative}
.kpi.lnk{cursor:pointer}.kpi.lnk:hover{border-color:var(--accent)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:4px;font-family:var(--font)}
.kpi .d{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:140px}
.fld label{font-size:11.5px;color:var(--muted);font-weight:500}
.fld select,.fld input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fld.grow{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--crit)}.btn.danger:hover{border-color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.menu-btn{display:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.t-main{font-weight:500}
.t-sub{font-size:12px;color:var(--muted);margin-top:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-info{background:var(--info-soft);color:var(--info)}.p-vio{background:var(--vio-soft);color:var(--vio)}.p-gray{background:var(--gray-soft);color:var(--gray)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;background:var(--gray-soft);color:var(--muted);font-weight:500;white-space:nowrap}
.crit{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600}
.crit i{display:inline-block;width:8px;height:8px;border-radius:2px}
.pbar{display:flex;align-items:center;gap:8px;min-width:110px}
.pbar .b{flex:1;height:6px;border-radius:6px;background:var(--line-2);overflow:hidden}
.pbar .b i{display:block;height:100%;border-radius:6px}
.pbar span{font-size:12px;color:var(--muted);width:36px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.diff{background:var(--crit-soft);color:var(--crit);text-decoration:line-through;padding:0 4px;border-radius:4px}
.diffn{background:var(--ok-soft);color:var(--ok);padding:0 4px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.stack{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--line-2);margin:4px 0 14px}
.stack i{display:block;height:100%}
svg text{fill:var(--muted);font-family:var(--font)}
/* Minha mesa */
.hero{background:linear-gradient(120deg,#0B2350 0%,#173E86 62%,#1F56B8 100%);color:#E4ECFB;border-radius:16px;padding:24px 26px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:320px;height:320px;border-radius:50%;border:44px solid rgba(255,255,255,.05)}
.hero h2{margin:0;font-size:24px;color:#fff;font-weight:600}
.hero p{margin:6px 0 0;color:#B8CBF0}
.hero .stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.hero .stats div b{display:block;font-family:var(--display);font-size:24px;color:#fff;font-variant-numeric:tabular-nums}
.hero .stats div span{font-size:12px;color:#B8CBF0}
.hero .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.18);color:#fff}
.hero .btn.pri{background:#fff;color:#0B2350;border-color:#fff}
.ring{position:relative;width:132px;height:132px;z-index:1}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-family:var(--display);font-size:28px;display:block;line-height:1}
.ring .c span{font-size:11px;opacity:.8}
.steps{display:flex;flex-direction:column}
.stp{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.stp:last-child{border-bottom:0}
.stp .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.stp .tx{flex:1;min-width:0}
.stp .tx b{font-weight:600}
.stp .tx p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow-x:auto;padding:14px 16px 16px}
.lane{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:160px;transition:background .15s,border-color .15s}
.lane.over{background:var(--accent-soft);border-color:var(--accent)}
.lane h4{margin:0;padding:10px 12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.lane .cs{padding:0 8px 10px;display:flex;flex-direction:column;gap:8px}
.oc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 2px rgba(16,35,70,.05)}
.oc:hover{border-color:var(--accent)}
.oc.drag{opacity:.4}
.oc .h{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.oc .h b{font-weight:600}
.oc small{color:var(--muted);font-size:11.5px}
/* espaço de análise */
.ws-head{padding:18px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.badge-org{width:58px;height:58px;border-radius:14px;background:linear-gradient(140deg,var(--accent-soft),var(--surface-2));color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12.5px;text-align:center;line-height:1.1;padding:4px;border:1px solid var(--line)}
.ws-head h2{margin:0;font-size:19px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:12.5px;margin-top:5px}
.meta b{color:var(--ink);font-weight:500}
.mini-ring{display:flex;align-items:center;gap:10px}
.flow{display:flex;align-items:stretch;border-top:1px solid var(--line-2);overflow-x:auto}
.flow button{flex:1;min-width:150px;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer;border-right:1px solid var(--line-2);display:flex;gap:10px;align-items:center;color:var(--muted)}
.flow button:last-child{border-right:0}
.flow button:hover{background:var(--surface-2)}
.flow .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none}
.flow button.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.flow button.cur{color:var(--ink);background:var(--accent-soft)}
.flow button.cur .n{border-color:var(--accent);background:var(--accent);color:#fff}
.flow b{display:block;font-size:12.5px;font-weight:600}
.flow small{font-size:11.5px}
.sheethead{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:14px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);align-items:center;border-radius:0 0 var(--r) var(--r)}
.sheethead span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sheethead b{font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .tag{margin-left:6px}
.split{display:grid;grid-template-columns:330px 1fr;min-height:620px}
.elist{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;position:sticky;top:0;align-self:start;max-height:calc(100vh - 70px)}
.elist .escroll{flex:1;max-height:none}
.elist .tools{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line-2)}
.elist input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip b{font-variant-numeric:tabular-nums}
.escroll{overflow:auto;max-height:760px}
.ini{padding:10px 12px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.eitem{display:flex;gap:10px;padding:9px 12px;cursor:pointer;border-left:3px solid transparent;align-items:flex-start}
.eitem:hover{background:var(--surface-2)}
.eitem.on{background:var(--accent-soft);border-left-color:var(--accent)}
.eitem .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.st-concluida{background:var(--ok);color:#fff}.st-andamento{border:2px solid var(--info);background:var(--info-soft)}.st-nao{border:2px dashed var(--line)}
.eitem .tx{min-width:0;flex:1;font-size:12.5px}
.eitem .tx b{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-weight:500}
.eitem .al{display:flex;gap:4px;margin-top:3px}
.eitem .al i{width:7px;height:7px;border-radius:50%}
.pane{display:grid;grid-template-columns:1fr 310px;min-width:0}
.pmain{padding:18px 20px;display:flex;flex-direction:column;gap:16px;min-width:0;border-right:1px solid var(--line-2)}
.pside{padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2)}
.ehead h3{margin:4px 0 0;font-size:16px;line-height:1.3}
.ehead .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.siplam{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:center;background:linear-gradient(180deg,var(--surface),var(--surface-2))}
.siplam span{display:block;font-size:11px;color:var(--muted);font-weight:500}
.siplam .sp{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:8px}
.siplam b{white-space:nowrap;font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup>label{font-size:12.5px;font-weight:600}
.fgroup>label small{font-weight:400;color:var(--faint);margin-left:6px}

.adet textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.adet .hintbox div{white-space:pre-wrap}
.prevline{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 10px}
.aempty{padding:14px;color:var(--muted);font-size:13px;text-align:center}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.card.inner{box-shadow:none}
.vflow{display:flex;flex-direction:column;padding:8px}
.vflow button{display:flex;gap:12px;align-items:center;border:0;background:none;padding:10px;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted)}
.vflow button:hover{background:var(--surface-2)}
.vflow button.cur{background:var(--accent-soft);color:var(--ink)}
.vflow .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.vflow .done .n{background:var(--ok);border-color:var(--ok);color:#fff}.vflow .cur .n{background:var(--accent);border-color:var(--accent);color:#fff}
.vflow b{display:block;font-size:13px}.vflow small{font-size:12px}
@media (max-width:1100px){.arow{grid-template-columns:22px 1fr 150px;}.arow .atxt,.arow.head>span:nth-child(4){display:none}.arow .dbtn{grid-column:2/-1}.arow .span2{grid-column:span 1}.adet,.twocol{grid-template-columns:1fr;padding-left:18px}.ohead,.orow,.ohead.wm,.orow.wm{grid-template-columns:1.5fr 1fr 130px}.ohead>span:nth-child(n+3):not(:last-child),.orow>div:nth-child(n+3):not(:last-child){display:none}.kpis{grid-template-columns:1fr 1fr}.ohd{grid-template-columns:auto 1fr}}
/* heatmap */
.heat{display:grid;gap:2px;font-size:11px}
.heat .rl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;cursor:pointer}
.heat .rl:hover{color:var(--accent)}
.heat i{display:block;height:15px;border-radius:3px;cursor:pointer}
.heat .ch{color:var(--muted);text-align:center}
/* guia */
.flowg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:18px}
.fg{padding:16px;position:relative}
.fg .nb{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600;margin-bottom:10px}
.fg:not(:last-child)::after{content:"";position:absolute;top:33px;left:58px;right:0;border-top:2px dashed var(--line)}
.fg b{display:block;font-family:var(--display);font-size:14.5px;margin-bottom:4px}
.fg p{margin:0;color:var(--muted);font-size:12.5px}
.fg .where{margin-top:8px;font-size:12px;color:var(--accent);font-weight:500}
/* drawer, modal, toast, tour */
.scrim{position:fixed;inset:0;background:rgba(10,22,45,.38);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:var(--surface);z-index:61;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(10,22,45,.18)}
.drawer.show{transform:none}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .dh h3{margin:0;font-size:16px}
.drawer .dh p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.drawer .db{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.drawer .df .l{margin-right:auto}
.x{border:0;background:none;cursor:pointer;color:var(--muted);margin-left:auto;padding:4px;border-radius:6px}
.x:hover{background:var(--surface-2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
.form label em{color:var(--crit);font-style:normal}
.form input,.form select,.form textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.form textarea{min-height:84px;resize:vertical}
.form .hint{font-size:11.5px;color:var(--faint);margin-top:4px}
.form .err{border-color:var(--crit)}
.radio{display:flex;gap:6px;flex-wrap:wrap}
.radio label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:0;color:var(--ink);font-weight:500;cursor:pointer}
.radio input{width:auto}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;pointer-events:none;opacity:0;transition:opacity .15s;padding:16px;background:rgba(10,22,45,.38)}
.modal.show{opacity:1;pointer-events:auto}
.modal .mb{background:var(--surface);border-radius:14px;width:min(460px,100%);box-shadow:0 20px 50px rgba(10,22,45,.3);padding:20px;max-height:92vh;overflow:auto}
.modal .mb.lg{width:min(760px,100%)}
.modal h3{margin:0 0 6px;font-size:17px}.modal p{margin:0 0 14px;color:var(--muted)}
.modal .act{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal textarea{width:100%;min-height:340px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:13px;line-height:1.55;resize:vertical;margin-bottom:12px}
.pal{position:fixed;inset:0;z-index:75;background:rgba(10,22,45,.38);display:none;justify-content:center;align-items:flex-start;padding:12vh 16px}
.pal.show{display:flex}
.pal .pb{background:var(--surface);width:min(620px,100%);border-radius:14px;box-shadow:0 20px 50px rgba(10,22,45,.3);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:15px;background:var(--surface);outline:none}
.pal .res{max-height:52vh;overflow:auto}
.pal .it{padding:10px 18px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.pal .it.sel,.pal .it:hover{background:var(--accent-soft)}
.pal .it small{color:var(--muted)}
.pal .gh{padding:8px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#11203B;color:#fff;padding:10px 14px;border-radius:10px;z-index:80;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .2s;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:13px;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#8DB6FF;font-weight:600;cursor:pointer}
.tour-hole{position:fixed;z-index:90;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,20,45,.62);pointer-events:none;transition:all .25s ease;outline:2px solid #5B95F5}
.tour-tip{position:fixed;z-index:91;background:var(--surface);border-radius:14px;padding:16px 18px;width:330px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.tour-tip .k{font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tour-tip h4{margin:4px 0 6px;font-family:var(--display);font-size:15.5px}
.tour-tip p{margin:0 0 12px;color:var(--muted);font-size:13px}
.tour-tip .a{display:flex;gap:8px;justify-content:flex-end}
.kan{display:grid;grid-template-columns:repeat(7,minmax(210px,1fr));gap:12px;overflow-x:auto;padding:16px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:120px}
.col h4{margin:0;padding:10px 12px;font-size:12.5px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
.col .cs{padding:8px;display:flex;flex-direction:column;gap:8px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.kc:hover{border-color:var(--accent)}
.kc b{font-weight:500;font-size:13px}
.kc .ft{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;gap:6px;flex-wrap:wrap}
.mcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.mcard .hd{display:flex;gap:10px;align-items:center}
.mcard .avatar{width:38px;height:38px;font-size:14px}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.mstats div{background:var(--surface-2);border-radius:8px;padding:8px 4px}
.mstats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.mstats span{font-size:11px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:10px;background:var(--accent-soft);font-size:13px}
.banner.w{background:var(--warn-soft)}
@media (max-width:1250px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}.g-2{grid-template-columns:1fr}.pane{grid-template-columns:1fr}.pside{border-top:1px solid var(--line-2)}.siplam{grid-template-columns:repeat(2,1fr)}.sheethead{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:65;transform:translateX(-100%);transition:transform .2s}
  .side.show{transform:none}
  .btn.menu-btn{display:inline-flex}
  .g-3,.split,.flowg{grid-template-columns:1fr}.fg::after{display:none}
  .elist{border-right:0;border-bottom:1px solid var(--line)}.escroll{max-height:320px}
  .top{padding:10px 16px}.content{padding:16px 16px 70px}.cmdk{min-width:0;order:5;width:100%}

}
@media (max-width:560px){.g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}.form,.two{grid-template-columns:1fr}.usr select{max-width:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== v7 · Identidade SGM / GEMONIT =====
   Paleta: azul institucional (ação), marinho (estrutura), verde-água (sinal de monitoramento, uso pontual).
   Status sempre com ícone + rótulo; cores com contraste AA sobre fundo claro. */
:root{
  --navy:#0B2545; --blue:#1E5AA8; --blue-600:#174A8C; --teal:#0F8B8D; --teal-soft:#E0F2F1;
  --accent:#1E5AA8; --accent-soft:#E7EEF9; --bg:#F3F5F9; --ink:#14213D; --muted:#55627A; --faint:#7A869C; --line:#D9E0EA; --line-2:#E8EDF4;
  --s-ag:#4B5565; --s-ag-bg:#ECEFF4; --s-an:#1E5AA8; --s-an-bg:#E3ECF9; --s-dv:#8A5300; --s-dv-bg:#FFEFD2; --s-re:#5B3FC4; --s-re-bg:#ECE8FC; --s-rc:#0E7A52; --s-rc-bg:#DEF2E8; --s-en:#4B5565; --s-en-bg:#E6E9EE;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Sora","IBM Plex Sans",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#07172E;--blue:#6C9BF0;--accent:#6C9BF0;--accent-soft:#1A2C50;--teal:#4FC3B8;--teal-soft:#123C3A;--bg:#0D1524;--ink:#E6ECF7;--muted:#A9B4C8;--faint:#8592AA;--line:#26375A;--line-2:#1F2E4B;
  --s-ag:#C3CCDA;--s-ag-bg:#25324A;--s-an:#9CC0FF;--s-an-bg:#1B2E52;--s-dv:#F6C26B;--s-dv-bg:#3A2D14;--s-re:#C3B4FF;--s-re-bg:#2A2550;--s-rc:#6FDCB0;--s-rc-bg:#15362D;--s-en:#C3CCDA;--s-en-bg:#25324A}}
:root[data-theme="dark"]{--navy:#07172E;--blue:#6C9BF0;--accent:#6C9BF0;--accent-soft:#1A2C50;--teal:#4FC3B8;--teal-soft:#123C3A;--bg:#0D1524;--ink:#E6ECF7;--muted:#A9B4C8;--faint:#8592AA;--line:#26375A;--line-2:#1F2E4B;
  --s-ag:#C3CCDA;--s-ag-bg:#25324A;--s-an:#9CC0FF;--s-an-bg:#1B2E52;--s-dv:#F6C26B;--s-dv-bg:#3A2D14;--s-re:#C3B4FF;--s-re-bg:#2A2550;--s-rc:#6FDCB0;--s-rc-bg:#15362D;--s-en:#C3CCDA;--s-en-bg:#25324A}
html,body{height:auto;min-height:100%}
body{background:var(--bg)}
body.out .gbar,body.out .gmain,body.out .gfoot{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* topo */
.gbar{position:sticky;top:0;z-index:50;background:var(--navy);color:#fff;box-shadow:0 2px 10px rgba(5,20,45,.25)}
.gin{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:0 24px;height:64px}
.glogo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:none}
.glogo b{display:block;font-family:var(--display);font-size:16px;letter-spacing:.04em}
.glogo small{display:block;font-size:11px;color:#A9BCDD;max-width:170px;line-height:1.25}
.gnav{display:flex;gap:2px;height:100%;overflow-x:auto;flex:1;min-width:0}
.gnav a{display:flex;align-items:center;gap:8px;padding:0 14px;color:#C9D6EE;text-decoration:none;font-weight:500;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.gnav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.gnav a.on{color:#fff;border-bottom-color:#5FD4C4}
.gnav .cnt{font-size:11px;background:rgba(255,255,255,.16);padding:1px 7px;border-radius:20px}
.gnav .cnt.al{background:#D9534F}
.gright{display:flex;align-items:center;gap:12px;flex:none}
.gsearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#C9D6EE;border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
.gsearch:hover{background:rgba(255,255,255,.14);color:#fff}
.gsearch kbd{font-size:10.5px;border:1px solid rgba(255,255,255,.25);border-radius:4px;padding:0 5px;font-family:var(--mono)}
.gcyc{display:flex;align-items:center;gap:6px;font-size:12px;color:#A9BCDD}
.gcyc select{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 8px;font-weight:500}
.gcyc select option{color:#14213D}
.guser{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.15)}
.guser .un{display:flex;flex-direction:column;line-height:1.15}.guser .un b{font-size:13px}.guser .un small{font-size:11px;color:#A9BCDD}
.gbtn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px}
.gbtn:hover{background:rgba(255,255,255,.1)}
/* cabeçalho da página */
.gmain{max-width:1440px;margin:0 auto;padding:0 24px 40px}
.phead{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;padding:22px 0 18px}
.phead .crumbs{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.phead .crumbs a{color:var(--muted)}
.phead h1{margin:0;font-size:26px;font-weight:600;color:var(--ink)}
.phead p{margin:4px 0 0;color:var(--muted);max-width:90ch;font-size:14px;grid-column:1}
#pextra{grid-row:2/4;grid-column:2;align-self:end}
#pagebox{display:flex;flex-direction:column;gap:18px}
.hstats{display:flex;gap:10px}
.hstats>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:112px}
.hstats a{text-decoration:none;color:inherit;display:block}
.hstats b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.hstats span{font-size:11.5px;color:var(--muted)}
.tc{color:var(--crit)!important}.twn{color:var(--s-dv)!important}
/* rodapé */
.gfoot{border-top:1px solid var(--line);background:var(--surface);margin-top:30px}
.gfoot .gin{height:auto;padding:16px 24px;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.gfoot button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
.gemlogo{display:inline-flex;align-items:center;gap:9px}
.gemlogo b{display:block;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:15px;color:var(--navy)}
.gemlogo small{display:block;font-size:11px;color:var(--muted)}
.gemlogo.dk b{color:#fff}.gemlogo.dk small{color:#A9BCDD}
/* login */
#login{background:var(--navy)}
.lg-wrap{display:grid;grid-template-columns:1fr 1fr;width:min(940px,100%);background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.lg-side{background:linear-gradient(160deg,#0B2545,#174A8C);color:#fff;padding:36px;display:flex;flex-direction:column;gap:16px}
.lg-side h2{font-size:24px;line-height:1.25;margin:28px 0 0}
.lg-side p{color:#C9D6EE;margin:0}
.lg-foot{margin-top:auto;font-size:12px;color:#A9BCDD}
.lg-card{padding:36px;border-radius:0;box-shadow:none;width:auto}
.lg-brand b{font-family:var(--display);letter-spacing:.05em}
/* status: ícone + rótulo + cor */
.sp{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.sp-aguardando{color:var(--s-ag);background:var(--s-ag-bg);border-color:#CFD6E1}.sp-analise{color:var(--s-an);background:var(--s-an-bg)}.sp-devolvido{color:var(--s-dv);background:var(--s-dv-bg)}
.sp-reanalise{color:var(--s-re);background:var(--s-re-bg)}.sp-recebido{color:var(--s-rc);background:var(--s-rc-bg)}.sp-encerrado{color:var(--s-en);background:var(--s-en-bg)}
.sitbar{display:flex;gap:8px;flex-wrap:wrap}
.sf{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.sf b{font-variant-numeric:tabular-nums;color:var(--muted)}
.sf.on{background:var(--navy);border-color:var(--navy);color:#fff}.sf.on b{color:#C9D6EE}
.toolbar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px}
/* cards de órgão */
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ocard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;border-top:4px solid var(--s-ag);box-shadow:0 1px 2px rgba(16,35,70,.05)}
.ocard:hover{box-shadow:0 8px 24px rgba(16,35,70,.1);border-color:#BFCBDD}
.ocard.s-analise{border-top-color:var(--s-an)}.ocard.s-devolvido{border-top-color:#D98A0B}.ocard.s-reanalise{border-top-color:var(--s-re)}.ocard.s-recebido{border-top-color:var(--s-rc)}.ocard.s-encerrado{border-top-color:#9AA5B5}
.oc-link{position:absolute;inset:0;border-radius:14px;z-index:0}
.ocard>*:not(.oc-link){position:relative;z-index:1;pointer-events:none}
.ocard .btn,.ocard a.btn{pointer-events:auto}
.ocard header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.oc-t b{display:block;font-family:var(--display);font-size:17px}
.oc-t small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.3}
.oc-pl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.oc-pl b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.oc-bar{height:8px;border-radius:8px;background:var(--line-2);overflow:hidden}
.oc-bar i{display:block;height:100%;border-radius:8px;background:var(--blue)}
.s-recebido .oc-bar i{background:var(--s-rc)}
.oc-p small{display:block;font-size:11.5px;color:var(--muted);margin-top:5px}
.oc-m{display:flex;gap:18px;margin:0;padding-top:12px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.oc-m dt{font-size:11px;color:var(--muted)}.oc-m dd{margin:1px 0 0;font-size:13px;font-weight:500}

/* página do órgão */

.tri-b{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.mstep{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.mstep li{display:flex;gap:8px;align-items:center}
.mstep span{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:700}

.mstep li.cur{color:var(--ink);font-weight:600}.mstep li.cur span{background:var(--blue);border-color:var(--blue);color:#fff}

.tri-dl dt{color:var(--muted)}.tri-dl dd{margin:0;font-weight:600;text-align:right}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl.mini li{font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line-2)}
.tl.mini small{color:var(--muted);margin-right:6px}
.tl>li:not(.t-sub){display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.tl .tli{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--blue)}
.tl .tl-con .tli{background:var(--teal-soft);color:var(--teal)}.tl .tl-exc .tli{background:var(--crit-soft);color:var(--crit)}
.tl b{font-weight:600}.tl small{color:var(--muted);font-size:12px}
.tl p{margin:3px 0 4px;font-size:13px;color:var(--ink);white-space:pre-wrap}
.tabs{padding:0 16px}
.tabs button{padding:14px 14px;font-size:14px}
.tabhead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;padding:18px 20px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
.tabhead h2{margin:0;font-size:18px}.tabhead p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:80ch}
.th-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.prog-s{font-size:12.5px;color:var(--muted)}.prog-s b{font-family:var(--display);font-size:16px;color:var(--ink)}
.pad{padding:16px 20px}
/* blocos da análise */
.blk{margin:16px 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.bh{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line-2);border-left:5px solid var(--blue)}
.blk-quant .bh{border-left-color:var(--teal)}.blk-qual .bh{border-left-color:var(--s-re)}
.bk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:20px;white-space:nowrap;background:var(--accent-soft);color:var(--blue)}
.blk-quant .bk{background:var(--teal-soft);color:var(--teal)}.blk-qual .bk{background:var(--s-re-bg);color:var(--s-re)}
.bt h3{margin:0;font-size:15px}.bt p{margin:2px 0 0;font-size:12.8px;color:var(--muted)}
.bb{padding:14px 16px}
.bb>.alist{border-radius:10px}
.qtiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.qtiles>div{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.qtiles span{font-size:11.5px;color:var(--muted)}.qtiles b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}.qtiles small{font-size:11.5px;color:var(--muted)}
.qtiles .w{background:var(--s-dv-bg);border-color:transparent}.qtiles .w b{color:var(--s-dv)}
.srcnote{margin:10px 0 0;font-size:11.5px;color:var(--faint);display:flex;gap:6px;align-items:center}
.qtxt{width:100%;min-height:96px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical;font-size:13.5px}
.qtxt:focus,.qin:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--accent-soft)}
.qtab td,.qtab th{padding:8px 10px}
.qtab td:first-child{max-width:260px}.qtab td:first-child small{display:block;color:var(--muted);font-size:11px}
.qtab .clamp1{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--line-2);color:var(--muted)}
.pc.w{background:var(--s-dv-bg);color:var(--s-dv)}.pc.g{background:var(--s-rc-bg);color:var(--s-rc)}
.qin{width:100%;min-width:180px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px}
.arow{grid-template-columns:22px minmax(200px,1.2fr) minmax(0,2fr) 210px}
.minis{display:flex;gap:6px;flex-wrap:wrap}.minis span{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--surface);border:1px solid var(--line-2)}
.minis .w{background:var(--s-dv-bg);color:var(--s-dv);border-color:transparent}.minis .g{background:var(--s-rc-bg);color:var(--s-rc);border-color:transparent}
.dbtn button.ok.on{background:var(--s-rc);border-color:var(--s-rc)}.dbtn button.aj.on{background:#B26A00;border-color:#B26A00}
/* iniciativas */
.inilay{display:grid;grid-template-columns:280px 1fr;gap:0}
.inilist{border-right:1px solid var(--line-2);padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.ini-i{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px;cursor:pointer;color:var(--ink)}
.ini-i:hover{background:var(--surface);border-color:var(--line)}
.ini-i.on{background:var(--surface);border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.ii-c{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue)}
.ii-n{font-size:12.8px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ii-p{display:block;width:100%}.ii-p small{display:block;font-size:11px;color:var(--muted)}.ii-p .oc-bar{display:block;height:5px;margin:4px 0 3px}.ii-p .oc-bar i{display:block}
.inimain{min-width:0;padding-bottom:4px}
.inih{padding:16px 20px 0;display:flex;flex-direction:column;gap:2px}
.inih h3{margin:0;font-size:16px}
/* pendências */
.pgrp{display:flex;flex-direction:column;gap:6px}
.pgrp h3{margin:6px 0 0;font-size:16px;display:flex;gap:8px;align-items:center}
.pgrp>p{margin:0 0 6px;color:var(--muted);font-size:13px}
.g-late h3{color:var(--crit)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--line)}
.pcard.u-late{border-left-color:var(--crit)}.pcard.u-soon{border-left-color:#D98A0B}.pcard.u-ok{border-left-color:var(--blue)}.pcard.u-done{border-left-color:var(--s-rc);opacity:.85}
.pc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.ptag{font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;color:var(--muted);background:var(--line-2);padding:2px 8px;border-radius:20px}
.porg{color:var(--muted)}.pst{margin-left:auto;font-weight:600;color:var(--muted)}
.pcard h4{margin:0;font-size:15px;line-height:1.35}
.pnext{background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.pnext span{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--blue)}
.pnext p{margin:3px 0 0;font-size:13.5px}
.pmeta{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pmeta dt{font-size:11px;color:var(--muted)}.pmeta dd{margin:1px 0 0;font-size:13px;font-weight:500}.pmeta small{color:var(--muted);font-weight:400}
.pcard footer{display:flex;gap:8px;flex-wrap:wrap}
/* acompanhamento */
.sub-h{margin:4px 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cycstrip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:20px}
.cycstrip>div{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cycstrip>div.cur{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.cycstrip span:first-child{font-size:12px;font-weight:600}.cycstrip small{font-size:11px;color:var(--muted)}
.cycstrip .sp{font-size:10.5px;padding:2px 7px;white-space:normal}
@media (max-width:1180px){.tri{grid-template-columns:1fr}.qtiles{grid-template-columns:repeat(2,1fr)}.inilay{grid-template-columns:1fr}.inilist{border-right:0;border-bottom:1px solid var(--line-2);flex-direction:row;overflow-x:auto}.ini-i{min-width:220px}.cycstrip{grid-template-columns:repeat(4,1fr)}.phead{grid-template-columns:1fr}#pextra{grid-row:auto;grid-column:1}.lg-wrap{grid-template-columns:1fr}.lg-side{display:none}}
@media (max-width:820px){.gin{flex-wrap:wrap;height:auto;padding:10px 16px;gap:10px}.gnav{order:3;width:100%;flex:none;height:44px}.glogo small{display:none}.gsearch span,.gsearch kbd,.gcyc>span{display:none}.gmain{padding:0 16px 30px}.ohd{grid-template-columns:auto 1fr}.ohd-p{grid-column:1/-1;border-left:0;padding-left:0}.hstats{flex-wrap:wrap}.arow{grid-template-columns:22px 1fr}.arow .atxt{display:none}.arow .dbtn{grid-column:2}.arow.head>span:nth-child(n+3){display:none}.blk{margin:12px}.pmeta{grid-template-columns:1fr}}

/* ===== Ajuste visual inspirado nas referências: claro, arejado, cards arredondados, navegação em pílula ===== */
:root{--bg:#EEF1F5;--surface:#FFFFFF;--surface-2:#F6F7FA;--line:#E1E5EC;--line-2:#ECEFF4;--r:20px;--shadow:0 1px 2px rgba(16,35,70,.04),0 10px 30px rgba(16,35,70,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1524;--surface:#141F35;--surface-2:#18253F}}
.gbar{background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);box-shadow:none;border-bottom:1px solid transparent}
.gin{height:76px}
.glogo{color:var(--ink)}.glogo small{color:var(--muted)}
.gnav{flex:0 1 auto;margin:0 auto;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;gap:2px;box-shadow:0 1px 2px rgba(16,35,70,.04)}
.gnav a{height:auto;padding:9px 18px;border-radius:999px;border-bottom:0;color:var(--muted);font-size:13.5px}
.gnav a:hover{background:var(--surface-2);color:var(--ink)}
.gnav a.on{background:var(--navy);color:#fff;border-bottom:0}
.gnav a .cnt{background:var(--line-2);color:var(--ink)}.gnav a.on .cnt{background:rgba(255,255,255,.2);color:#fff}
.gsearch{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:8px 14px}
.gsearch:hover{color:var(--ink);background:var(--surface)}
.gsearch kbd{border-color:var(--line)}
.gcyc{color:var(--muted)}
.gcyc select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:7px 12px}
.guser{border-left:0;padding-left:0;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 6px}
.guser .un small{color:var(--muted)}
.gbtn{border:0;color:var(--muted);border-radius:999px;padding:6px 12px}
.gbtn:hover{background:var(--surface-2);color:var(--ink)}
.phead{padding:18px 0 22px}
.phead h1{font-family:var(--display);font-size:36px;font-weight:600;letter-spacing:-.02em}
.phead .crumbs{font-size:13px}
.card,.ocard,.pcard,.blk,.hstats>div,.tri-c{border-radius:20px;border-color:var(--line);box-shadow:var(--shadow)}
.ocard{border-top-width:0;padding:20px}
.ocard::before{content:"";position:absolute;left:20px;right:20px;top:0;height:3px;border-radius:0 0 4px 4px;background:var(--s-ag)}
.ocard.s-analise::before{background:var(--s-an)}.ocard.s-devolvido::before{background:#D98A0B}.ocard.s-reanalise::before{background:var(--s-re)}.ocard.s-recebido::before{background:var(--s-rc)}.ocard.s-encerrado::before{background:#9AA5B5}
.ocard:hover{transform:translateY(-1px)}
.btn{border-radius:999px;padding:8px 16px}
.btn.sm{padding:6px 13px}
.btn.pri{background:var(--navy);border-color:var(--navy)}
.btn.pri:hover{background:#163a66;filter:none}
.sf{padding:7px 14px}
.tabs{display:inline-flex;gap:4px;margin:14px 16px 0;padding:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;border-radius:999px;padding:9px 16px;font-size:13.5px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,35,70,.12);border:0}
.blk{box-shadow:none}
.bh{border-left:0;padding:16px 18px}
.bh .bk{flex:none}
.alist{border-radius:14px}
.hstats>div{padding:12px 16px}
.toolbar{border-radius:20px}
.ohd{padding:18px 22px}
.badge-org{border-radius:16px;color:var(--blue)}
.inilist{background:transparent}
.ini-i.on{box-shadow:none;border-color:var(--navy)}
.pnext{border-radius:14px}
.gfoot{background:transparent;border-top:1px solid var(--line)}
.qtiles>div{border-radius:16px}
.cycstrip>div{border-radius:14px}
@media (max-width:1100px){.gnav{margin:0}}
@media (max-width:1380px){.glogo small{display:none}}

/* ===== v8 · Menu lateral (como nas referências), marca GEMONIT e modo noturno ===== */
:root{--side-w:260px}
:root[data-theme="dark"]{--bg:#0D1524;--surface:#141F35;--surface-2:#18253F;--navy:#2F6FD6;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25)}
.gbar{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);z-index:60;background:var(--surface);border-right:1px solid var(--line);backdrop-filter:none;-webkit-backdrop-filter:none;overflow-y:auto}
.gbar .gin{flex-direction:column;align-items:stretch;justify-content:flex-start;height:100%;min-height:100%;max-width:none;padding:22px 16px 18px;gap:14px}
.gbar .glogo{padding:2px 6px 8px;gap:11px}.gbar .glogo b{font-size:17px;letter-spacing:.04em}.gbar .glogo small{display:block!important;font-size:11.5px;line-height:1.25}
.gbar .gsearch{width:100%;justify-content:flex-start;border-radius:12px;padding:10px 12px;background:var(--surface-2);font-size:13px}
.gbar .gsearch span{flex:1;text-align:left}
.gbar .gnav{flex:none;flex-direction:column;margin:0;background:none;border:0;box-shadow:none;padding:0;gap:2px;overflow:visible;height:auto;border-radius:0}
.gbar .nsec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:14px 12px 6px}
.gbar .gnav a{position:relative;justify-content:flex-start;gap:11px;padding:10px 12px;border-radius:12px;font-size:14px;color:var(--muted);font-weight:500}
.gbar .gnav a svg{flex:none;opacity:.85}
.gbar .gnav a .nl{flex:1}
.gbar .gnav a:hover{background:var(--surface-2);color:var(--ink)}
.gbar .gnav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.gbar .gnav a.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.gbar .gnav a.on .cnt{background:var(--accent);color:#fff}
.gbar .gright{flex-direction:column;align-items:stretch;gap:10px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.gbar .gcyc{display:flex;flex-direction:column;align-items:stretch;gap:4px;font-size:11.5px}
.gbar .gcyc select{width:100%;border-radius:10px}
.gtheme{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px}
.gtheme:hover{background:var(--surface-2)}
.gbar .guser{border-radius:12px;padding:8px}
.gbar .guser .un{flex:1;min-width:0}
.gmain{margin-left:var(--side-w);max-width:none;padding:0 32px 40px}
.gmain>.phead,.gmain>#pagebox{max-width:1400px;margin-left:auto;margin-right:auto}
.gfoot{margin-left:var(--side-w)}
.page-tabs{margin:0 0 14px}
.htab td,.htab th{vertical-align:middle}
.mini{display:flex;align-items:center;gap:8px;justify-content:flex-end}.mini .oc-bar{width:64px;height:5px;display:block}.mini .oc-bar i{display:block}
.htab.grade th.cur,.htab.grade td.cur{background:var(--accent-soft)}
.htab.grade td{text-align:center;white-space:nowrap}.htab.grade td small{display:block;color:var(--faint);font-size:11px;margin-top:2px}
.gcell{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--gray-soft);color:var(--gray)}
.gcell.g-analise{background:var(--info-soft);color:var(--info)}.gcell.g-devolvido{background:var(--warn-soft);color:var(--warn)}.gcell.g-reanalise{background:var(--vio-soft);color:var(--vio)}.gcell.g-recebido{background:var(--ok-soft);color:var(--ok)}
.toolbar .seg{align-self:flex-end;border-radius:999px}.toolbar .seg button{padding:8px 14px}
[data-theme="dark"] .btn.pri{background:#2F6FD6;border-color:#2F6FD6}
[data-theme="dark"] .gbar .gnav a.on .cnt{color:#0D1524}
[data-theme="dark"] .ocard,[data-theme="dark"] .card{background:var(--surface)}
@media (max-width:900px){
 .gbar{position:sticky;width:auto;bottom:auto;border-right:0;border-bottom:1px solid var(--line)}
 .gbar .gin{flex-direction:row;flex-wrap:wrap;height:auto;padding:10px 14px;gap:10px}
 .gbar .gsearch{width:auto;flex:1}.gbar .glogo small{display:none!important}
 .gbar .gnav{flex-direction:row;order:3;width:100%;overflow-x:auto}.gbar .nsec{display:none}.gbar .gnav a.on::before{display:none}
 .gbar .gright{flex-direction:row;margin:0;border:0;padding:0;align-items:center}.gbar .gcyc>span,.gtheme span{display:none}
 .gmain,.gfoot{margin-left:0}.gmain{padding:0 16px 30px}}

/* Histórico · todos os meses no formato de planejador (faixas por período, mês atual destacado) */
.planner{padding:6px 0 0;overflow-x:auto}
.pl-head,.pl-body>*{min-width:0}
.pl-head{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:12px 18px 8px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--line-2)}
.pl-body{display:grid;grid-template-columns:190px 1fr;gap:6px 10px;padding:10px 18px 14px;min-width:860px}
.pl-head{min-width:860px}
.pl-name{display:flex;flex-direction:column;justify-content:center;cursor:pointer;padding:4px 0}.pl-name b{font-size:13.5px}.pl-name small{color:var(--muted);font-size:11.5px}
.pl-name.hd{font-size:12px;color:var(--muted);font-weight:600;cursor:default}
.pl-track{display:grid;gap:4px;align-items:stretch;position:relative}
.pl-m{display:flex;flex-direction:column;align-items:center;font-size:12.5px;font-weight:600;padding:6px 0;border-radius:10px;color:var(--ink)}
.pl-m small{font-size:10.5px;font-weight:500;color:var(--faint)}
.pl-m.cur{background:var(--accent);color:#fff}.pl-m.cur small{color:rgba(255,255,255,.8)}
.pl-bg{grid-row:1;height:44px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-2)}
.pl-bg.cur{background:transparent;border:1px dashed var(--accent)}
.pl-bar{grid-row:1;z-index:1;margin:3px;display:flex;align-items:center;gap:7px;min-width:0;border:0;border-radius:9px;padding:0 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-align:left;box-shadow:0 1px 2px rgba(16,35,70,.08)}
.pl-bar .pl-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.55);flex:none}
.pl-bar .pl-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.pl-bar .pl-d{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.6)}
.pl-bar.g-aguardando{background:var(--gray-soft);color:var(--gray)}
.pl-bar.g-analise{background:var(--info-soft);color:var(--info)}
.pl-bar.g-devolvido{background:var(--warn-soft);color:var(--warn)}
.pl-bar.g-reanalise{background:var(--vio-soft);color:var(--vio)}
.pl-bar.g-recebido{background:var(--ok-soft);color:var(--ok)}
.pl-bar.g-encerrado{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line-2) 6px 12px);color:var(--muted)}
[data-theme="dark"] .pl-bar .pl-ic,[data-theme="dark"] .pl-bar .pl-d{background:rgba(255,255,255,.1)}
.pl-bar:hover{filter:brightness(.97);outline:2px solid currentColor;outline-offset:-2px}
.pl-leg{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px 16px;border-top:1px solid var(--line-2)}

/* ===================================================================
   v9 · GEMONIT em preto e verde (mesma família visual da ASID)
   Fundo papel, menu preto, verde-limão como destaque, verde do Governo
   nas ações, títulos em Space Grotesk e textos em Inter.
   =================================================================== */
:root{--font:"Inter",system-ui,sans-serif;--display:"Space Grotesk","Inter",system-ui,sans-serif;
 --bg:#F3F2EE;--surface:#FFFFFF;--surface-2:#F7F6F2;--ink:#15151C;--muted:#5E5E6B;--faint:#8B8B98;--line:#E6E4DD;--line-2:#F0EEE8;
 --side:#111117;--side2:#1C1C24;--lime:#009E3C;--mint:#FFDA00;--green:#009E3C;--green-d:#006B2A;--accent:#009E3C;--accent-2:#009E3C;--accent-soft:#E7F5EA;--navy:#15151C;--blue:#008A35;--teal:#008A35;
 --info:#15151C;--info-soft:#ECEBE4;--ok:#008A35;--ok-soft:#E7F5EA;--warn:#B7791F;--warn-soft:#FDF4E1;--crit:#D93F44;--crit-soft:#FDECEC;--vio:#6D4FD8;--vio-soft:#F0ECFD;--gray:#6B6B78;--gray-soft:#EFEEE9;
 --s-ag:#5E5E6B;--s-ag-bg:#EFEEE9;--s-an:#FFDA00;--s-an-bg:#15151C;--s-dv:#8A5A00;--s-dv-bg:#FDF0D2;--s-re:#5B3FC4;--s-re-bg:#EEEAFD;--s-rc:#007A35;--s-rc-bg:#E2F4E6;--s-en:#6B6B78;--s-en-bg:#ECEBE6;
 --ring-bg:#EEEDE8;--hatch:#DCDAD2;--g-bg:#F1F0EB;--g-hatch:#DCDAD2;--g-fg:#009E3C;
 --r:16px;--shadow:0 1px 2px rgba(20,20,30,.04),0 6px 20px rgba(20,20,30,.05);--side-w:256px}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E0F13;--surface:#17181D;--surface-2:#1E1F25;--ink:#ECECF1;--muted:#B0B0BC;--faint:#82828F;--line:#2A2B33;--line-2:#222329;
 --side:#08090B;--side2:#16171C;--lime:#19B24E;--green:#19B24E;--green-d:#006B2A;--accent:#FFDA00;--accent-2:#7BD88F;--accent-soft:rgba(123,216,143,.14);--navy:#ECECF1;--blue:#7BD88F;
 --info:#ECECF1;--info-soft:#2A2B33;--ok:#7BD88F;--ok-soft:rgba(123,216,143,.14);--warn:#F0B44A;--warn-soft:rgba(240,180,74,.14);--crit:#F07A7E;--crit-soft:rgba(229,72,77,.16);--vio:#B3A2F7;--vio-soft:rgba(140,110,240,.18);--gray:#A3A3AF;--gray-soft:#24252C;
 --s-ag:#B0B0BC;--s-ag-bg:#24252C;--s-an:#fff;--s-an-bg:#19B24E;--s-dv:#F0B44A;--s-dv-bg:rgba(240,180,74,.15);--s-re:#C3B4FF;--s-re-bg:rgba(140,110,240,.2);--s-rc:#7BD88F;--s-rc-bg:rgba(123,216,143,.15);--s-en:#A3A3AF;--s-en-bg:#24252C;
 --ring-bg:#26272E;--hatch:#33343C;--g-bg:#1E1F25;--g-hatch:#2E2F37;--g-fg:#19B24E;--shadow:none}
body{background:var(--bg);font-family:var(--font);color:var(--ink)}
a{color:var(--accent)}
h1,h2,h3,.phead h1{font-family:var(--display);letter-spacing:-.02em}
.phead h1{font-size:38px;font-weight:700}
.phead .crumbs{text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;font-weight:600;color:var(--faint)}
.sp-aguardando{border-color:var(--line)}
/* menu lateral preto */
.gbar{background:var(--side);border-right:0;color:#B6B6C2}
.gbar .glogo,.gbar .glogo b{color:#fff}.gbar .glogo small{color:#8B8B98}
.gbar .gsearch{background:var(--side2);border:1px solid #2A2B33;color:#B6B6C2}.gbar .gsearch kbd{border-color:#3A3B44;color:#8B8B98;background:transparent}
.gbar .nsec{color:#6E6E7A}
.gbar .gnav a{color:#B6B6C2}
.gbar .gnav a:hover{background:var(--side2);color:#fff}
.gbar .gnav a.on{background:var(--lime);color:#fff}
.gbar .gnav a.on::before{display:none}
.gbar .gnav a .cnt{background:#2A2B33;color:#ECECF1}.gbar .gnav a.on .cnt{background:rgba(0,0,0,.25);color:#fff}
.gbar .gnav a .cnt.al{background:#E5484D;color:#fff}
.gbar .gright{border-top-color:#22232A}
.gtheme{background:var(--side2);border-color:#2A2B33;color:#ECECF1}.gtheme:hover{background:#25262E}
.gbar .gcyc{color:#8B8B98}.gbar .gcyc select{background:var(--side2);border-color:#2A2B33;color:#ECECF1}
.gbar .guser{background:var(--side2);border-color:#2A2B33}.gbar .guser .un b{color:#fff}.gbar .guser .un small{color:#8B8B98}
.gbar .gbtn{color:#B6B6C2}.gbar .gbtn:hover{background:#25262E;color:#fff}
/* botões, filtros e abas */
.btn{border-radius:10px}
.btn.pri{background:#15151C;border-color:#15151C;color:#fff}.btn.pri:hover{background:var(--green);border-color:var(--green);color:#fff}
[data-theme="dark"] .btn.pri{background:#ECECF1;border-color:#ECECF1;color:#111117}[data-theme="dark"] .btn.pri:hover{background:var(--lime);border-color:var(--lime);color:#fff}
.sf{border-radius:10px}.sf.on{background:#15151C;border-color:#15151C;color:#fff}.sf.on b{color:var(--mint)}
[data-theme="dark"] .sf.on{background:var(--lime);border-color:var(--lime);color:#fff}[data-theme="dark"] .sf.on b{color:#fff}
.tabs{border-radius:12px}.tabs button{border-radius:9px}
.seg button.on{background:#15151C;color:#fff}[data-theme="dark"] .seg button.on{background:#ECECF1;color:#111117}
.card,.ocard,.pcard,.tri-c,.blk,.toolbar{border-radius:var(--r);box-shadow:var(--shadow);border-color:var(--line)}
/* blocos de indicadores */
.bento{display:grid;grid-template-columns:1.35fr repeat(4,1fr);gap:16px;margin-bottom:22px}
.kp{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;color:var(--ink);text-decoration:none;box-shadow:var(--shadow);min-height:168px;transition:transform .15s}
a.kp:hover{transform:translateY(-2px)}
.kp header{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto;gap:8px}
.kp>b{font-family:var(--display);font-size:38px;line-height:1;margin-top:14px;font-weight:700}.kp>b em{font-style:normal;font-size:20px;color:var(--faint);font-weight:500}
.kp>span{font-weight:600;font-size:13.5px}.kp>small{color:var(--muted);font-size:12px}
.kp-ic{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.kp-ic.y{background:var(--lime);border-color:var(--lime);color:#fff}.kp-ic.g{background:var(--accent-soft);border-color:transparent;color:var(--accent)}.kp-ic.r{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.kp-go{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--ink);transform:rotate(-45deg)}
.kp.hero{background:#111117;border-color:#111117;color:#fff;align-items:center;text-align:center;--g-bg:#1C1D23;--g-hatch:#3A3B44;--g-fg:#19B24E;overflow:hidden}
.kp.hero::after{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,rgba(0,158,60,.22),transparent 65%)}
.kp.hero>*{position:relative;z-index:1}.kp.hero::after{z-index:0}
.kp.hero header{width:100%;margin:0;font-weight:600;font-size:13.5px;color:#ECECF1}.kp.hero .kp-go{border-color:#33343C;color:#fff}
.kp.hero small{color:#9C9CA8}.kp.hero .gauge{margin-top:6px;max-width:100%;height:auto;color:#fff}
.kp.dark{background:var(--green-d);border-color:var(--green-d);color:#fff}.kp.dark>small{color:rgba(255,255,255,.85)}.kp.dark .kp-ic.y{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}.kp.dark .kp-go{border-color:rgba(255,255,255,.4);color:#fff}
.mbars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:10px}
.mbars i{flex:1;background:repeating-linear-gradient(135deg,var(--g-bg) 0 4px,var(--hatch) 4px 7px);border-radius:6px;position:relative}
.mbars i.cur{background:#15151C}[data-theme="dark"] .mbars i.cur{background:var(--lime)}
.mbars i small{position:absolute;bottom:-15px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--faint);font-style:normal}
.kbar{height:8px;border-radius:6px;background:var(--ring-bg);margin-top:10px;overflow:hidden}.kbar i{display:block;height:100%;background:var(--green);border-radius:6px}
/* Meus órgãos: cartões + próximo passo */
.mlay{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.mlay .ogrid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.ocard::before{display:none}
.ocard{padding:18px;gap:12px;border-top:1px solid var(--line)}
.ocard header{align-items:center}.ocard .oc-t b{font-family:var(--display);font-size:19px}
.ocard .rg{flex:none;color:var(--ink)}
.oc-p{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.nextc{position:sticky;top:20px;padding:22px;overflow:hidden;text-align:left}
.nextc h3{margin:12px 0 4px;font-size:19px}.nextc>p{color:var(--muted);font-size:13px;margin:0 0 12px}
.nextc ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nextc li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-2)}
.nextc li span{display:flex;flex-direction:column;min-width:0}.nextc li small{color:var(--muted);font-size:11.5px}
.orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,#F0FFC4 14%,#C8F04A 42%,#009E3C 78%,#007A35 100%);box-shadow:0 18px 36px rgba(45,164,74,.35),inset -8px -10px 18px rgba(0,0,0,.18);animation:orbf 6s ease-in-out infinite}
@keyframes orbf{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}
/* Análise */
.alay{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:start}
.apick{position:sticky;top:20px;padding:0;overflow:hidden}
.ap-h{display:flex;flex-direction:column;gap:8px;padding:16px 16px 10px;border-bottom:1px solid var(--line-2)}
.ap-h input{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
.ap-l{display:flex;flex-direction:column;padding:8px;max-height:calc(100vh - 220px);overflow:auto}
.ap-l a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;color:var(--ink);text-decoration:none}
.ap-l a:hover{background:var(--surface-2)}.ap-l a.on{background:#15151C;color:#fff}.ap-l a.on small{color:#B6B6C2}
[data-theme="dark"] .ap-l a.on{background:var(--lime);color:#fff}[data-theme="dark"] .ap-l a.on small{color:rgba(255,255,255,.75)}
.ap-l a span{display:flex;flex-direction:column}.ap-l small{color:var(--muted);font-size:11.5px}
.ap-l .rg{flex:none}.ap-l a.on .rg circle:first-child{stroke:rgba(255,255,255,.15)}
.awork{display:flex;flex-direction:column;gap:14px;min-width:0}
.aw-h{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px}
.aw-h h2{margin:4px 0 8px;font-size:28px}.aw-h h2 small{font-family:var(--font);font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.aw-m{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:13px;color:var(--muted)}.aw-m b{color:var(--ink)}
.aw-h .gauge{color:var(--ink);flex:none}
.acta{display:flex;align-items:center;gap:14px;padding:16px 20px;margin:0 0 18px;border-radius:var(--r);background:#111117;color:#fff;text-decoration:none;box-shadow:var(--shadow)}
.acta:hover{background:#1C1C24}
.acta-ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--lime);color:#fff;flex:none}
.acta-t{display:flex;flex-direction:column;flex:1}.acta-t b{font-family:var(--display);font-size:17px}.acta-t small{color:#9C9CA8}
.acta-go{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--lime);color:#fff;transform:rotate(-45deg)}
.ohd-p{align-items:center;text-align:center}.ohd-p .gauge{color:var(--ink)}
.badge-org{background:var(--lime);color:#fff;border:0}
svg.gauge text,svg.rg text{fill:currentColor}
.tl.mini li{display:flex;gap:12px;justify-content:flex-start;text-align:left;padding:8px 0}.tl.mini li::before,.tl.mini::before{display:none}.tl.mini{align-self:stretch;width:100%;align-items:stretch}
.pl-bar.g-analise .pl-ic,.pl-bar.g-analise .pl-d{background:rgba(255,218,0,.16);color:var(--mint)}[data-theme="dark"] .pl-bar.g-analise .pl-ic,[data-theme="dark"] .pl-bar.g-analise .pl-d{background:rgba(0,0,0,.12);color:#111117}
[data-theme="dark"] .acta{background:#1E1F25;border:1px solid #2A2B33}[data-theme="dark"] .kp.hero{border-color:#2A2B33}
/* histórico */
.pl-m.cur{background:#15151C;color:#fff}[data-theme="dark"] .pl-m.cur{background:var(--lime);color:#fff}
.pl-bg.cur{border-color:var(--green)}
.pl-bar.g-analise,.gcell.g-analise{background:#15151C;color:var(--mint)}
[data-theme="dark"] .pl-bar.g-analise,[data-theme="dark"] .gcell.g-analise{background:var(--lime);color:#fff}
.pl-bar.g-aguardando{background:repeating-linear-gradient(135deg,var(--g-bg) 0 6px,var(--line-2) 6px 12px);color:var(--muted)}
.oc-bar i,.mini .oc-bar i{background:var(--green)}
/* tela de entrada (como a da ASID) */
#login{background:var(--bg);padding:0;display:block}
.lg2{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lg2-side{position:relative;overflow:hidden;background:#111117;color:#fff;padding:40px 56px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.lg2-brand{position:absolute;top:36px;left:56px;display:flex;gap:12px;align-items:center}.lg2-brand b{display:block;font-family:var(--display);font-size:18px;letter-spacing:.04em}.lg2-brand small{color:#8B8B98;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em}
.lg2-wm{position:absolute;right:-30px;top:12%;font-family:var(--display);font-weight:700;font-size:200px;line-height:1;color:transparent;-webkit-text-stroke:1.5px #26272E;letter-spacing:-.04em;pointer-events:none;writing-mode:vertical-rl;transform:rotate(180deg)}
.lg2-sq{position:absolute;border-radius:22px}
.lg2-sq.a{width:84px;height:84px;background:var(--green);top:15%;right:30%}
.lg2-sq.b{width:84px;height:84px;background:var(--lime);top:15%;right:calc(30% - 100px)}
.lg2-sq.c{width:40px;height:40px;border:2px solid var(--lime);border-radius:12px;bottom:22%;right:14%}
.lg2-side h1{position:relative;font-size:clamp(34px,4.2vw,58px);line-height:1.04;margin:60px 0 0;max-width:12ch}
.lg2-side h1 em{font-style:normal;color:var(--lime)}
.lg2-side>p{position:relative;color:#B6B6C2;font-size:16px;max-width:44ch;margin:0}
.lg2-q{position:relative;display:flex;flex-wrap:wrap;gap:8px;max-width:520px}
.lg2-q span{border:1px solid #33343C;border-radius:20px;padding:7px 14px;font-size:13px;color:#ECECF1}
.lg2-foot{position:absolute;bottom:28px;left:56px;color:#6E6E7A;font-size:12px}
.lg2-form{display:grid;place-items:center;background:var(--surface);padding:40px}
.lg2-in{width:min(380px,100%)}
.lg2-in h2{font-size:28px;margin:0 0 6px}
.lg2-in .lg-form input{padding:12px 14px;border-radius:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.lg2-in .lg-form input:focus{outline:2px solid var(--green);outline-offset:1px}
.lg2-btn{justify-content:center;padding:13px;margin-top:14px;border-radius:12px;font-size:14.5px}
.lg2-lock{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12.5px;margin:14px 0 0}
.lg2-in .lg-demo{margin-top:22px}
@media (max-width:1300px){.bento{grid-template-columns:repeat(3,1fr)}.bento .kp.hero{grid-row:span 2}.mlay{grid-template-columns:1fr}.nextc{position:static}}
@media (max-width:900px){.lg2{grid-template-columns:1fr}.lg2-side{min-height:auto;padding:90px 24px 70px}.lg2-wm,.lg2-sq{display:none}.alay{grid-template-columns:1fr}.apick{position:static}.ap-l{max-height:260px}.bento{grid-template-columns:1fr 1fr}.aw-h{flex-direction:column;align-items:flex-start}
 .gbar .gnav a.on{background:var(--lime)}}

/* ===== v10 · verde escuro, menu recolhível, utilidades no canto, análise em cartões ===== */
/* respiro entre filtros e cartões */
.sitbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.bento{margin-bottom:26px}
.nextc .kp-ic{margin-bottom:4px}
.kp .kbar{margin-top:12px}
/* canto superior direito: melhorias e modo noturno */
.gmain{position:relative}
.gtop{position:absolute;top:22px;right:32px;display:flex;gap:8px;z-index:5}
.gt-b{display:inline-flex;align-items:center;gap:7px;height:38px;min-width:38px;justify-content:center;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;font-size:13px;font-weight:500;cursor:pointer;box-shadow:var(--shadow)}
.gt-b:hover{border-color:var(--accent);color:var(--accent)}
#thBtn{padding:0}
.phead{padding-top:24px}.phead #pextra{margin-top:8px}
/* menu recolhível */
.gcol{position:absolute;top:26px;right:14px;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;border:1px solid #2A2B33;background:transparent;color:#8B8B98;cursor:pointer;z-index:2}
.gcol:hover{color:#fff;background:#1C1C24}
.gbar .glogo{padding-right:36px}
.side-min{--side-w:80px}
.side-min .gbar .gin{padding:22px 12px 18px;align-items:center}
.side-min .gbar .glogo>span:last-child,.side-min .gbar .nsec,.side-min .gbar .gnav a .nl,.side-min .gbar .gsearch span,.side-min .gbar .gsearch kbd,.side-min .gbar .gcyc,.side-min .gbar .guser .un,.side-min .gbar .gbtn{display:none}
.side-min .gbar .glogo{padding:0;margin-top:40px}
.side-min .gcol{position:absolute;top:18px;left:50%;right:auto;transform:translateX(-50%)}
.side-min .gbar .gsearch{width:44px;height:44px;padding:0;justify-content:center}
.side-min .gbar .gnav a{justify-content:center;padding:12px 0;width:52px}

/* análise: cada campo é um cartão */

/* tela de entrada nova */
.lg3{display:grid;grid-template-columns:minmax(420px,1fr) 1.15fr;min-height:100vh;background:var(--surface)}

.lg3-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 60% 40%,#000 0,transparent 75%)}
.fc{position:absolute;background:#fff;color:#15151C;border-radius:18px;padding:16px 18px;box-shadow:0 24px 50px rgba(0,0,0,.35)}

.fc-c{top:52%;left:24%;display:flex;gap:12px;align-items:center;font-size:13px}.fc-c span:last-child{display:flex;flex-direction:column}.fc-c small{color:#5E5E6B}
.fc-d{top:47%;right:14%;background:#FFDA00;display:flex;align-items:center;gap:10px;transform:rotate(-3deg)}.fc-d b{font-family:var(--display);font-size:40px;line-height:1}.fc-d small{font-size:12px;font-weight:600;line-height:1.2}
.lg3-cap{position:absolute;left:48px;right:48px;bottom:44px;margin:0;color:#fff;font-family:var(--display);font-size:clamp(24px,2.4vw,34px);line-height:1.15;font-weight:600;max-width:20ch}

@media (max-width:900px){.lg3{grid-template-columns:1fr}.lg3-art{display:none}.lg3-form{padding:110px 24px 70px}.lg3-brand,.lg3-foot{left:24px}.gtop{top:12px;right:16px}.gt-b span{display:none}.gcol{display:none}}

/* ===== v11 · verde em gradiente, sem traço sobre o anel, análise mais larga ===== */

svg.rg{border:0!important;background:none!important}

.gbar .gnav a.on{box-shadow:0 6px 16px rgba(0,158,60,.35)}

.kbar i,.oc-bar i,.mini .oc-bar i,.mbar i{background:var(--grad)}

.checks label:has(input:checked){background:linear-gradient(135deg,#E6F6EC,#D6F0DF)}
[data-theme="dark"] .checks label:has(input:checked){background:rgba(255,218,0,.14)}
.gbar .gnav a.on .cnt{background:rgba(0,0,0,.25)}
/* números institucionais: físico e financeiro separados */
.qgroups{display:grid;grid-template-columns:1fr;gap:14px}
.qe-dl{margin:6px 0 0;display:flex;flex-direction:column;gap:4px}.qe-dl div{display:flex;flex-direction:column;font-size:12px}.qe-dl dd{font-size:14px}.qe-dl dt{color:var(--muted)}.qe-dl dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

/* iniciativas: faixa de seleção no topo, conteúdo em largura total */

 --grad:linear-gradient(135deg,#19B24E 0%,#009E3C 55%,#007A2F 100%);--grad-d:linear-gradient(140deg,#009E3C 0%,#006B2A 60%,#004A1D 100%);

function sugestoes(e){
  const s=[]; const um=e.um.toLowerCase();
  if(e.saldo>0) s.push({f:'qt',t:`Saldo a distribuir de ${brl(e.saldo)}. Distribuir o valor liquidado nos meses de execução.`,w:'Há saldo a distribuir no SIPLAM'});
  if(e.fisAc===0&&e.liq>0) s.push({f:'qt',t:`Há ${brl(e.liq)} liquidado sem físico realizado até ${MESL()}. Verificar se houve entrega do produto e corrigir o físico.`,w:'Liquidação sem físico'});
  else if(e.fisAc===0) s.push({f:'qt',t:`Sem execução física e financeira até ${MESL()}. Solicitar justificativa e cronograma de execução.`,w:'Entrega sem execução'});
  else s.push({f:'qt',t:e.liq>0?`Físico realizado de ${nf.format(e.fisAc)} (${um}) e liquidado de ${brlC(e.liq)} até ${MESL()} – financeiro ok.`:`Físico realizado de ${nf.format(e.fisAc)} (${um}) até ${MESL()}.`,w:'Resumo dos números do SIPLAM'});
  if(e.acum==='S'&&e.fisAc>0&&e.fisOut===0) s.push({f:'qt',t:`Sem físico registrado em ${MESL()}. Confirmar se houve execução no mês.`,w:'Mês do ciclo zerado'});

}
