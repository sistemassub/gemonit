  (S.extraE||[]).forEach(e=>put('extraE',e.cod,e.org,e));
  ['P','R','I','M','H','cons'].forEach(k=>(S[k]||[]).forEach(x=>put(k,x.id,x.org,x)));
  (S.trash||[]).forEach(t=>{ if(t.tid==null) t.tid=nid(); put('trash',t.tid,t.item?.org,t); });
  Object.entries(ANX).forEach(([k,L])=>{ if(L&&L.length) put('anx',k,orgDeKey(k),{L}); });
  return m;
}

function syncBadge(st,msg){ const el=document.getElementById('syncSt'); if(!el) return; el.className='sync'+(st==='err'?' err':'');
  el.textContent=st==='pend'?'Salvando…':st==='ok'?'Tudo salvo':st==='err'?(msg||'Não foi possível salvar'):''; }

function save(){ if(!ME) return; syncBadge('pend'); clearTimeout(SYNC_T); SYNC_T=setTimeout(()=>{ SYNC_T=null; pushNow(); },500); }

async function pushNow(){
  if(!ME) return; if(SYNC_BUSY){ SYNC_AGAIN=true; return; } SYNC_BUSY=true;
  try{
    const cur=snapshot(); const up=[], del=[];
    cur.forEach((v,k)=>{ const o=LAST.get(k); if(!o||o.j!==v.j||o.org!==v.org) up.push(v); });
    LAST.forEach((v,k)=>{ if(!cur.has(k)) del.push(v); });
    let err=null; const ts=new Date().toISOString();
    for(let i=0;i<up.length&&!err;i+=250){ const {error}=await sb.from('gemonit_docs').upsert(up.slice(i,i+250).map(v=>({colecao:v.col,id:v.id,org:v.org,dados:JSON.parse(v.j),atualizado_por:ME.usuario,atualizado_em:ts}))); if(error) err=error; }
    for(const v of del){ if(err) break; const {error}=await sb.from('gemonit_docs').delete().eq('colecao',v.col).eq('id',v.id); if(error) err=error; }
    if(err){ console.error(err);
      const perm=/row-level|permission|violates/i.test(err.message||'');
      syncBadge('err', perm?'Alteração não permitida':'Erro ao salvar');
      toast(perm?(ME.papel==='consulta'?'Seu acesso é só de consulta: a alteração não foi salva.':'Você só pode alterar os órgãos em que é titular ou substituto. A alteração foi desfeita.'):'Não foi possível salvar. Confira a conexão e tente de novo.');
      if(perm){ await pull(); render(true); } else setTimeout(save,8000);
    } else { LAST=cur; syncBadge('ok'); }
  }catch(e){ console.error(e); syncBadge('err','Sem conexão'); setTimeout(save,8000); }
  finally{ SYNC_BUSY=false; if(SYNC_AGAIN){ SYNC_AGAIN=false; save(); } }
}

async function fetchDocs(){ let out=[], from=0;
  for(;;){ const {data,error}=await sb.from('gemonit_docs').select('colecao,id,org,dados').order('colecao').order('id').range(from,from+999); if(error) throw error; out=out.concat(data); if(data.length<1000) break; from+=1000; }
  return out; }

function setEntregas(arr){
  E.length=0; Object.keys(EBY).forEach(k=>delete EBY[k]); Object.keys(EBO).forEach(k=>delete EBO[k]);
  (arr||[]).forEach(a=>{ const e={cod:a[0],nome:a[1],org:a[2],ini:a[3],inome:a[4],prog:a[5],pnome:a[6],um:a[7],cls:a[8],tipo:a[9],acum:a[10],estr:a[11],liq:a[12],saldo:a[13],fis:a[14],fin:a[15],stm:a[16],nloc:a[17],dini:a[18],dfim:a[19]};
    const f=e.fis.slice(0,CUR); e.fisAc=e.acum==='S'?f.reduce((s,x)=>s+x,0):Math.max(0,...f); e.fisOut=e.fis[CUR-1]||0; E.push(e); EBY[e.cod]=e; (EBO[e.org]=EBO[e.org]||[]).push(e); });
}

function applyBase(rows){
  const cfg=(rows.find(r=>r.id==='config')||{}).dados||{};
  ANO=+cfg.ano||new Date().getFullYear(); CUR=+cfg.ciclo||Math.max(1,new Date().getMonth()); PRAZO_ANALISE=cfg.prazo||'';
  const ini=Math.min(CUR,+cfg.inicio||1); CICLOS.splice(0,CICLOS.length,...Array.from({length:CUR-ini+1},(_,i)=>ini+i)); CICLOS_D.splice(0,CICLOS_D.length,...CICLOS.slice().reverse());
  const b=rows.find(r=>r.id==='entregas'); BASEINFO=b?{...b.dados,E:undefined,n:(b.dados.E||[]).length,em:b.atualizado_em}:null;
  setEntregas(b?.dados?.E||[]);
}

function buildState(rows){
  const old=S||{}; const s=fresh(); s.drafts=old.drafts||{}; s.sess=old.sess; s.user=old.user; s.cyc=CICLOS.includes(old.cyc)?old.cyc:CUR; s.last=old.last;
  CICLOS.forEach(m=>s.ciclos[m]={}); ANX={}; Object.keys(SEED.anPrev).forEach(k=>delete SEED.anPrev[k]);
  const perfil={};
  rows.forEach(r=>{ const d=r.dados; const c=r.colecao;
    if(PER_CIC[c]){ const i=r.id.indexOf(':'); const m=+r.id.slice(0,i), k=r.id.slice(i+1);
      if(m===CUR){ if(c==='txt') s.txtImp[k]=d.v; else s[PER_CIC[c]][k]=d; }
      else if(m===CUR-1&&c==='an') SEED.anPrev[k]=d; return; }
    switch(c){
      case 'org': s.orgs.push({...d,focal:'',perfil:'',estrat:'',valid:''}); break;
      case 'perfil': perfil[r.id]=d; break;
      case 'ciclo': { const [m,cod]=r.id.split(':'); (s.ciclos[m]=s.ciclos[m]||{})[cod]=d; break; }
      case 'prev': s.prevImp[r.id]=d; break;
      case 'extraE': s.extraE.push(d); break;
      case 'trash': s.trash.push(d); break;
      case 'anx': ANX[r.id]=d.L||[]; break;
      case 'P': case 'R': case 'I': case 'M': case 'H': case 'cons': s[c].push(d); break;
    } });
  s.orgs.forEach(o=>Object.assign(o,perfil[o.cod]||{}));
  s.orgs.sort((a,b)=>a.sig.localeCompare(b.sig,'pt-BR'));
  CICLOS.forEach(m=>s.orgs.forEach(o=>{ if(!s.ciclos[m][o.cod]) s.ciclos[m][o.cod]=CIC_DEF(); }));
  const byTs=(a,b)=>String(b.ts||'').localeCompare(String(a.ts||''));
  s.H.sort(byTs); s.cons.sort(byTs); s.trash.sort(byTs); ['P','R','I','M'].forEach(k=>s[k].sort((a,b)=>a.id-b.id));
  S=s; S.extraE.forEach(addExtraE); index();
}

async function pull(){
  const [b,docs,m]=await Promise.all([sb.from('gemonit_base').select('id,dados,atualizado_em,atualizado_por'),fetchDocs(),sb.from('gemonit_membros').select('*').order('nome')]);
  if(b.error) throw b.error; if(m.error) throw m.error;
  MEMBROS=m.data||[]; MON.splice(0,MON.length,...MEMBROS.filter(x=>x.papel==='monitor'&&x.ativo&&x.apelido).map(x=>x.apelido));
  applyBase(b.data||[]); buildState(docs); LAST=snapshot(); PULL_AT=Date.now();
}

async function afterAuth(fromForm){
  try{
    const {data:{user}}=await sb.auth.getUser(); if(!user){ loginScreen(); return; }
    const usuario=String(user.email||'').split('@')[0].toLowerCase();
    const {data:m,error}=await sb.from('gemonit_membros').select('*').eq('usuario',usuario).maybeSingle();

    if(!m||!m.ativo){ await sb.auth.signOut(); loginScreen('Seu usuário do HUB ainda não tem acesso ao GEMONIT. Peça a liberação a um administrador.'); return; }
    ME=m; loginLoading('Carregando os dados…'); await pull();

async function boot(){
  loginLoading();
  const {data:{session}}=await sb.auth.getSession();

  sb.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'&&ME){ ME=null; S=fresh(); loginScreen(); } });
  /* traz o que os colegas salvaram, sem atrapalhar quem está digitando */
  const busyUI=()=>{ const a=document.activeElement; return SYNC_BUSY||SYNC_T||$('#drawer')?.classList.contains('open')||$('#modal')?.classList.contains('show')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=='cycSel'); };
  const refresh=async()=>{ if(!ME||document.visibilityState!=='visible'||busyUI()||Date.now()-PULL_AT<40000) return; try{ await pull(); if(!busyUI()) render(true); }catch(e){} };
  setInterval(refresh,20000); document.addEventListener('visibilitychange',refresh);
  window.addEventListener('beforeunload',e=>{ if(SYNC_T||SYNC_BUSY){ e.preventDefault(); e.returnValue=''; } });
}

/* importa o relatório do SIPLAM (uma linha por localidade) e agrupa por entrega */
const MESES_UP=['JANEIRO','FEVEREIRO','MARCO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const numBR=v=>{ if(typeof v==='number') return v; const s=String(v??'').trim(); if(!s) return 0; return +(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0; };
const codNome=v=>{ const s=String(v??'').trim(); const i=s.indexOf(' - '); return i<0?[+s||0,s]:[+s.slice(0,i)||0,s.slice(i+3).trim()]; };
const ORG_ALIAS={2907:2900};
async function baseImport(f){
  const box=$('#admImp'); box.innerHTML=`<p class="t-sub">${ic('clock',13)} Lendo ${esc(f.name)}…</p>`;
  try{
    const X=await loadXLSX(); const wb=X.read(await f.arrayBuffer(),{type:'array'});
    const rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});
    const N=s=>semAcento(String(s)).toUpperCase().trim();
    const hi=rows.findIndex(r=>{ const n=r.map(N); return n.includes('ENTREGA')&&n.includes('ORGAO')&&n.includes('INICIATIVA'); });
    if(hi<0) throw new Error('Não encontrei as colunas ÓRGÃO, INICIATIVA e ENTREGA. Confira se é o relatório de monitoramento do SIPLAM.');
    const H={}; rows[hi].forEach((c,i)=>{ const k=N(c); if(!(k in H)) H[k]=i; });
    const g=(r,k)=>r[H[k]]??'';
    const ent=new Map(); let linhas=0; const fora={};
    for(const r of rows.slice(hi+1)){
      if(!String(g(r,'ENTREGA')).trim()) continue; linhas++;
      let [oc]=codNome(g(r,'ORGAO')); oc=ORG_ALIAS[oc]||oc;
      if(!OB[oc]){ fora[oc]=String(g(r,'ORGAO')); continue; }
      const [cod,nome]=codNome(g(r,'ENTREGA')); const key=oc+'|'+cod; let e=ent.get(key);
      if(!e){ const [ic2,inm]=codNome(g(r,'INICIATIVA')), [pc,pnm]=codNome(g(r,'PROGRAMA'));
        e={cod,nome,org:oc,ini:ic2,inome:inm,prog:pc,pnome:pnm,um:String(g(r,'UNIDADE MEDIDA')),cls:String(g(r,'CLASSIFICACAO PRODUTO')),tipo:String(g(r,'TIPO DO PRODUTO')),acum:String(g(r,'ACUMULA META FISICA ANO')).trim().toUpperCase().startsWith('S')?'S':'N',estr:String(g(r,'ESTRATEGIA DE MONITORAMENTO')),liq:numBR(g(r,'LIQUIDADO TOTAL')),saldo:numBR(g(r,'SALDO DISTRIBUIR')),fis:Array(12).fill(0),fin:Array(12).fill(0),stm:{},nloc:0,dini:String(g(r,'DATA INICIO ENTREGA')),dfim:String(g(r,'DATA FIM ENTREGA'))};
        ent.set(key,e); }
      e.nloc++; const st=String(g(r,'STATUS MONITORAMENTO')); e.stm[st]=(e.stm[st]||0)+1;
      MESES_UP.forEach((m,i)=>{ e.fis[i]+=numBR(g(r,'FISICO '+m)); e.fin[i]+=numBR(g(r,'FINANCEIRO '+m)); });
    }
    const arr=[...ent.values()].map(e=>[e.cod,e.nome,e.org,e.ini,e.inome,e.prog,e.pnome,e.um,e.cls,e.tipo,e.acum,e.estr,Math.round(e.liq),Math.round(e.saldo),e.fis.map(x=>Math.round(x*100)/100),e.fin.map(x=>Math.round(x)),Object.entries(e.stm).sort((a,b)=>b[1]-a[1])[0]?.[0]||'',e.nloc,e.dini,e.dfim]);
    if(!arr.length) throw new Error('Nenhuma entrega dos órgãos cadastrados foi encontrada no arquivo.');
    const nOrg=new Set(arr.map(a=>a[2])).size; const fk=Object.keys(fora);
    ADM.imp={arr,fonte:f.name,linhas};
    box.innerHTML=`<div class="banner" style="margin-top:12px">${ic('check',16)}<span><b>${nf0.format(arr.length)} entregas</b> de <b>${nOrg} órgãos</b>, a partir de ${nf0.format(linhas)} linhas.${fk.length?` ${fk.length} órgão(s) do arquivo não estão cadastrados e ficaram de fora: ${esc(fk.map(k=>fora[k]).join('; '))}.`:''}${BASEINFO?' A base atual será substituída; as análises já feitas continuam.':''}</span></div>
      <div class="act" style="margin-top:10px"><button class="btn" data-act="admImpCancel">Cancelar</button><button class="btn pri" data-act="admImpOk">Gravar base</button></div>`;
  }catch(e){ console.error(e); box.innerHTML=`<div class="banner" style="margin-top:12px">${ic('info',16)}<span>${esc(e.message||'Não foi possível ler o arquivo.')}</span></div>`; }
}

function stepsOf(cod){ const s=INST_F.map(f=>'i:'+f.id); iniciativas(cod).forEach(g=>{ INI_F.forEach(f=>s.push(`n:${g.ini}:${f.id}`)); g.ents.forEach(e=>s.push(e.cod)); }); return s; }

function progOrg(cod){ const st=stepsOf(cod).map(k=>stepState(cod,k)); return {n:st.length,ok:st.filter(x=>x==='ok').length,aj:st.filter(x=>x==='aj').length,done:st.filter(x=>x).length}; }
function nextAction(o){
  const c=S.ciclos[S.cyc][o.cod]||{}; const pr=progOrg(o.cod);
  if(!canEdit(o.cod)) return {l:'Ver órgão',go:`#orgao-${o.cod}`,sec:1};
  if(c.st==='encerrado') return {l:'Ver órgão',go:`#orgao-${o.cod}`,sec:1,why:'Órgão sem monitoramento neste ciclo.'};
  if(c.st==='aguardando') return {l:'Registrar envio',act:`editCiclo:${o.cod}`,why:'O órgão ainda não enviou no SIPLAM.'};
  if(c.st==='devolvido') return {l:'O órgão reenviou',act:`setSit:${o.cod}:reanalise`,why:'Aguardando o órgão corrigir no SIPLAM. Quando ele reenviar, clique abaixo para conferir de novo.'};
  if(c.st==='recebido') return {l:'Ver órgão',go:`#orgao-${o.cod}`,sec:1,why:'Análise concluída sem ajustes neste ciclo.'};
  if(pr.done<pr.n) return {l:pr.done?'Continuar análise':'Começar análise',go:`#analise-${o.cod}`,why:`Faltam ${pr.n-pr.done} itens para analisar.`};
  if(pr.aj) return {l:'Gerar devolutiva',act:`devol:${o.cod}`,why:`Análise concluída com ${pr.aj} ajuste(s).`};
  return {l:'Devolver sem ajuste',act:`setSit:${o.cod}:recebido`,why:'Análise concluída: nada a ajustar.'};
}

function fieldDecide2(k,v,org){

function previsto(e){ return S.prevImp?.[e.cod]||{meta:0,dot:0,est:0,nd:true}; }
function entTexto(e){ return S.txtImp?.['ent:'+e.cod]??''; }
function instTexto(o,fid){ return S.txtImp?.[`inst:${o.cod}:${fid}`]??''; }
function iniTexto(ini,fid){ return S.txtImp?.[`ini:${ini}:${fid}`]??''; }
function iniciativas(cod){ const g=[]; (EBO[cod]||[]).forEach(e=>{ let x=g.find(y=>y.ini===e.ini); if(!x){ x={ini:e.ini,nome:e.inome,ents:[]}; g.push(x);} x.ents.push(e); }); return g; }

/* --- estado dos campos (institucional e iniciativa) --- */
const ckKey=(nivel,ref,fid)=>`${nivel}|${ref}|${fid}`;
const ckGet=k=>(S.ck=S.ck||{})[k]||{ck:{},dec:'',com:''};
function nivelStatus(nivel,ref){ const F=nivel==='inst'?INST_F:INI_F; const st=F.map(f=>ckGet(ckKey(nivel,ref,f.id))); const d=st.filter(s=>s.dec).length; return {d,n:F.length,aj:st.filter(s=>s.dec==='aj').length,done:d===F.length}; }
function stIcon(done,partial){ return `<span class="st st-${done?'concluida':partial?'andamento':'nao'}">${done?ic('check',12):''}</span>`; }

function leituras(e){
  const p=previsto(e); const r=[]; const pc=100*e.fisAc/(p.meta||1);
  if(!p.meta) r.push(['w','Meta prevista ainda não importada.','Importe o print da iniciativa para conferir a meta.']);
  else if(pc>=100.5) r.push(['g',`Meta superada: ${nf.format(+pc.toFixed(1))}% (${nf.format(e.fisAc)} de ${fmtMeta(p.meta)}).`,'O texto precisa explicar por que superou.']);
  else if(pc>=99.5) r.push(['g',`Meta alcançada: ${nf.format(e.fisAc)} de ${fmtMeta(p.meta)}.`,'']);
  else r.push(['w',`Meta não alcançada: ${nf.format(+pc.toFixed(1))}% (${nf.format(e.fisAc)} de ${fmtMeta(p.meta)}).`,'O texto precisa explicar o motivo.']);
  if(!p.dot) r.push(['g','Sem dotação própria.','As perguntas financeiras do hint não se aplicam.']);
  else { const pl=100*e.liq/p.dot; r.push([pl<90?'w':'g',`Liquidado ${nf.format(+pl.toFixed(1))}% da dotação autorizada.`,pl<90?'O texto precisa explicar por que não liquidou tudo.':'']); }
  if(e.saldo>0) r.push(['w',`Saldo a distribuir de ${brlC(e.saldo)} no SIPLAM.`,'O órgão precisa distribuir nos meses de execução.']);
  return r;
}
const naEnt=(e,i)=>!previsto(e).dot&&(i===2||i===3);
const AN_LABEL={ql:'Análise qualitativa',qt:'Análise quantitativa',gec:'Equivalente no GECEG',comp:'Comparativa SIPLAM/GECEG',adeq:'Adequações ao PPA',cat:'Categoria da alteração',aj:'Pedir ajuste ao órgão',fin:'Análise finalizada'};
function readPane(cod){

  if(base.dec===undefined) base.dec=base.fin?(base.aj?'aj':'ok'):'';
  f.querySelectorAll('[data-k]').forEach(el=>{ base[el.dataset.k]=el.value; });
  const ck={}; f.querySelectorAll('[data-eck]').forEach(el=>{ if(el.checked) ck[el.dataset.eck]=true; }); base.ck=ck;

}
function draft(cod){ const v=readPane(cod); S.drafts[cod]={ql:v.ql,qt:v.qt,gec:v.gec,comp:v.comp,adeq:v.adeq,cat:v.cat,dec:v.dec,ck:v.ck}; S.last=cod; save(); const si=$('#savedInfo'); if(si) si.innerHTML=`${ic('clock',13)} Rascunho salvo automaticamente às ${nowIso().slice(11)}`; }
function commit(cod){
  const e=EBY[cod]; const old=S.an[cod]; const v=readPane(cod); if(!v.gec) v.comp='';
  if(!v.dec){ toast('Escolha “Está OK” ou “Pedir ajuste” antes de salvar.'); return false; }
  if(v.dec==='aj'&&!v.ql.trim()){ toast('Escreva o que o órgão precisa ajustar.'); $('#f-ql')?.focus(); return false; }
  const nv={ql:v.dec==='ok'?(v.ql.trim()||'OK'):v.ql.trim(),qt:(v.qt||'').trim(),gec:!!v.gec,comp:(v.comp||'').trim(),adeq:(v.adeq||'').trim(),cat:v.cat||'',aj:v.dec==='aj',fin:true,ck:v.ck};
  const base={ql:'',qt:'',gec:false,comp:'',adeq:'',cat:'',aj:false,fin:false,...(old||{})};
  const ch=[]; Object.keys(AN_LABEL).forEach(k=>{ const x=base[k]??'', y=nv[k]??''; if(String(x)!==String(y)) ch.push({campo:AN_LABEL[k],de:typeof x==='boolean'?(x?'Sim':'Não'):x,para:typeof y==='boolean'?(y?'Sim':'Não'):y}); });
  delete S.drafts[cod]; S.last=cod;
  S.an[cod]={...(old||{}),...nv,data:ch.length?hoje():(old?.data||hoje()),por:ch.length?S.user:(old?.por||S.user)};
  if(ch.length) audit('analise',cod,`Entrega ${cod} · ${OB[e.org].sig}`,old?'Edição':'Criação',ch,e.org);
  save(); return ch.length;
}

/* devolutiva: junta tudo o que foi marcado como "Pedir ajuste" nos três níveis */
function devolutiva(cod){
  const o=OB[cod]; const c=S.ciclos[S.cyc][cod]; const groups=iniciativas(cod);
  const instAj=INST_F.map(f=>({f,s:ckGet(ckKey('inst',cod,f.id))})).filter(x=>x.s.dec==='aj');
  const iniAj=groups.map(g=>({g,l:INI_F.map(f=>({f,s:ckGet(ckKey('ini',g.ini,f.id))})).filter(x=>x.s.dec==='aj')})).filter(x=>x.l.length);
  const ents=(EBO[cod]||[]).filter(e=>S.an[e.cod]?.aj);
  const pend=(EBO[cod]||[]).filter(e=>anStatus(e.cod)!=='concluida').length; const insS=nivelStatus('inst',cod);
  let nT=0; const T=t=>`\n${++nT}. ${t}\n`;
  let txt=`Prezado(a) ${o.focal},\n\nConcluímos a análise do monitoramento de ${MESESL[S.cyc-1].toLowerCase()}/2026 da ${o.sig} no SIPLAM. Solicitamos os ajustes abaixo:\n`;
  if(instAj.length){ txt+=T('DESCRIÇÃO ANALÍTICA INSTITUCIONAL'); instAj.forEach(x=>{ txt+=`• ${x.f.t}: ${x.s.com||pedido(x.f.ck)}\n`; }); }
  else if(!insS.d&&c.inst!=='Completo') txt+=T('DESCRIÇÃO ANALÍTICA INSTITUCIONAL')+`• ${c.instObs||'Atualizar o texto institucional.'}\n`;
  if(iniAj.length){ txt+=T('INICIATIVAS'); iniAj.forEach(x=>{ txt+=`• Iniciativa ${x.g.ini} – ${x.g.nome}\n`; x.l.forEach(y=>{ txt+=`   – ${y.f.t}: ${y.s.com||pedido(y.f.ck)}\n`; }); }); }
  if(ents.length){ txt+=T('RESULTADO DAS ENTREGAS'); ents.forEach(e=>{ const a=S.an[e.cod]; const q=a.qt&&!/^ok\b/i.test(a.qt)&&!/financeiro ok\.?$/i.test(a.qt)?' '+a.qt:''; txt+=`• ${e.cod} – ${e.nome}\n   ${a.ql}${q}\n`; }); }
  txt+=`\nPedimos que os ajustes sejam feitos no SIPLAM até ${fdate(PRAZO_ANALISE)}. Qualquer dúvida, estamos à disposição.\n\nAtenciosamente,\n${S.user}\nGerência de Monitoramento – GEMONIT/SCPMA`;
  const nada=!instAj.length&&!iniAj.length&&!ents.length&&!(!insS.d&&c.inst!=='Completo');
  const avisos=[pend?`${pend} entrega(s) ainda sem análise`:'',insS.d<insS.n?`${insS.n-insS.d} campo(s) do institucional sem análise`:''].filter(Boolean);
  $('#modalBox').className='mb lg';
  $('#modalBox').innerHTML=`<h3>Devolutiva para ${esc(o.sig)}</h3><p>${nada?'Nada foi marcado como "Pedir ajuste".':`Texto montado com tudo o que foi marcado como "Pedir ajuste": ${instAj.length} campo(s) do institucional, ${iniAj.length} iniciativa(s) e ${ents.length} entrega(s). Revise antes de enviar.`}${avisos.length?` <b style="color:var(--warn)">Atenção: ${avisos.join(' e ')}.</b>`:''}</p>
  ${nada?`<div class="banner">${ic('check')}<span>Nada foi marcado como ajuste. Você pode concluir o ciclo como <b>Devolvido sem ajuste</b>.</span></div><div class="act" style="margin-top:14px"><button class="btn" data-act="mClose">Fechar</button><button class="btn ok" data-act="setSitNow:${cod}:recebido">Devolver sem ajuste</button></div>`:
  `<textarea id="devTxt">${esc(txt)}</textarea><div class="act"><button class="btn" data-act="mClose">Fechar</button><button class="btn" data-act="copyDev">${ic('copy',14)} Copiar texto</button><button class="btn pri" data-act="sendDev:${cod}">${ic('send',14)} Registrar envio e marcar como devolvido</button></div>`}`;
  $('#modal').classList.add('show');
}

function svgStackCols(series){
  const w=560,h=200,pad={l:28,r:8,t:10,b:24}; const max=Math.max(...series.map(s=>Object.values(s.counts).reduce((a,b)=>a+b,0)));
  const bw=(w-pad.l-pad.r)/series.length; let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Situação por ciclo">`;
  [0,.5,1].forEach(g=>{const y=pad.t+(h-pad.t-pad.b)*(1-g); s+=`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${pad.l-6}" y="${y+4}" text-anchor="end" font-size="10">${Math.round(max*g)}</text>`;});
  series.forEach((sr,i)=>{ let y=h-pad.b; const x=pad.l+i*bw+bw*.18;
    SIT_ORDER.slice().reverse().forEach(k=>{ const v=sr.counts[k]||0; if(!v) return; const bh=(h-pad.t-pad.b)*v/max; y-=bh; s+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${bh}" fill="${SIT_COLOR[k]}"><title>${sr.label} · ${SIT[k].l}: ${v}</title></rect>`; });
    s+=`<text x="${x+bw*.32}" y="${h-7}" text-anchor="middle" font-size="11" style="${sr.cur?'fill:var(--ink);font-weight:600':''}">${sr.label}</text>`; });
  return s+'</svg>';
}

function fieldHtml(fd,v,pre){
  if(fd.show&&!fd.show(v)) return '';
  const id=pre+fd.k, val=v[fd.k]??''; let inp;
  if(fd.t==='textarea') inp=`<textarea id="${id}" data-k="${fd.k}">${esc(val)}</textarea>`;
  else if(fd.t==='select') inp=`<select id="${id}" data-k="${fd.k}">${fd.req?'':'<option value="">Selecione</option>'}${(typeof fd.opts==='function'?fd.opts():fd.opts).map(o=>{const [ov,ol]=Array.isArray(o)?o:[o,o];return `<option value="${esc(ov)}" ${String(ov)===String(val)?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
  else if(fd.t==='bool') inp=`<div class="radio"><label><input type="radio" name="${id}" data-k="${fd.k}" value="1" ${val?'checked':''}> Sim</label><label><input type="radio" name="${id}" data-k="${fd.k}" value="0" ${!val?'checked':''}> Não</label></div>`;
  else inp=`<input id="${id}" data-k="${fd.k}" type="${fd.t||'text'}" value="${esc(val)}">`;
  return `<div class="${fd.full?'full':''}"><label for="${id}">${esc(fd.l)}${fd.req?' <em>*</em>':''}</label>${inp}${fd.hint?`<div class="hint">${esc(fd.hint)}</div>`:''}</div>`;
}
function readForm(root,fields,base){
  const v={...base};
  fields.forEach(fd=>{ const els=root.querySelectorAll(`[data-k="${fd.k}"]`); if(!els.length) return;
    if(fd.t==='bool'){ const c=[...els].find(x=>x.checked); v[fd.k]=c?c.value==='1':false; }
    else if(fd.t==='number'||fd.num){ v[fd.k]=els[0].value===''?null:+els[0].value; }
    else v[fd.k]=els[0].value.trim(); });
  return v;
}
function fmtVal(fd,x){ if(fd.t==='bool') return x?'Sim':'Não'; if(fd.opts){const o=(typeof fd.opts==='function'?fd.opts():fd.opts).find(o=>Array.isArray(o)?String(o[0])===String(x):o===x); if(o) return Array.isArray(o)?o[1]:o;} if(fd.t==='date') return x?fdate(x):''; return x==null?'':String(x); }
function diffs(fields,a,b){ const r=[]; fields.forEach(fd=>{ const x=a[fd.k]??(fd.t==='bool'?false:''), y=b[fd.k]??(fd.t==='bool'?false:''); if(String(x)!==String(y)) r.push({campo:fd.l,de:fmtVal(fd,x),para:fmtVal(fd,y),k:fd.k,v0:x}); }); return r; }
function validate(root,fields,v){ let ok=true; fields.forEach(fd=>{ if(fd.req&&(v[fd.k]===''||v[fd.k]==null)&&(!fd.show||fd.show(v))){ ok=false; root.querySelector(`[data-k="${fd.k}"]`)?.classList.add('err'); } }); if(!ok) toast('Preencha os campos obrigatórios marcados com *.'); return ok; }

function pgCiclos(m){
  if(!m||!CICLOS.includes(m)){ location.replace('#ciclos-'+S.cyc); return; }
  setHead('Ciclos','Escolha um mês para ver como foi o ciclo: envios, situação final e cada órgão.','');
  const at=m2=>S.orgs.filter(o=>S.ciclos[m2][o.cod]?.st!=='encerrado');
  const stat=m2=>{ const a=at(m2), cy=S.ciclos[m2]; const c=k=>a.filter(o=>(cy[o.cod]?.st||'aguardando')===k).length; const env=a.filter(o=>cy[o.cod]?.env).length; return {n:a.length,env,rec:c('recebido'),dev:c('devolvido'),ag:c('aguardando'),pe:Math.round(100*env/Math.max(1,a.length)),pr:Math.round(100*c('recebido')/Math.max(1,a.length))}; };
  const st=stat(m); const cy=S.ciclos[m]; const q=ui.cq||{sit:''}; const listAll=S.orgs.filter(o=>!q.sit||(cy[o.cod]?.st||'aguardando')===q.sit).sort((a,b)=>PRI[cy[a.cod]?.st]-PRI[cy[b.cod]?.st]||a.sig.localeCompare(b.sig)); const list=ui.cqAll?listAll:listAll.slice(0,12);
  const ser=CICLOS_D.map(x=>({m:x,...stat(x)}));

const addD=(d,n)=>{ const x=new Date(d+'T12:00'); x.setDate(x.getDate()+n); const m=new Date(HOJE); return (x>m?m:x).toISOString().slice(0,10); };
function marcos(cod,m=S.cyc){
  const c=S.ciclos[m]?.[cod]||{}; const hs=S.H.filter(h=>h.ent==='ciclo'&&h.ref===`${m}:${cod}`&&h.campo==='Situação');
  const when=k=>{ const h=hs.find(x=>x.para===SIT[k].l); return h?h.ts.slice(0,10):null; };
  const st=c.st||'aguardando'; const env=c.env&&c.data?c.data:null;
  let dev=['devolvido','reanalise','recebido'].includes(st)&&env?(when('devolvido')||addD(env,2+cod%5)):null; if(dev&&dev<env) dev=addD(env,1+cod%3);
  let ree=['reanalise'].includes(st)||(st==='recebido'&&cod%3===0)?(when('reanalise')||addD(dev||env,3+cod%4)):null; if(ree&&ree<(dev||env)) ree=addD(dev||env,2);
  let rec=st==='recebido'?(when('recebido')||addD(ree||dev||env,2)):null; if(rec&&rec<(ree||dev||env)) rec=addD(ree||dev||env,1);
  const last=[rec,ree,dev,env].find(Boolean); const parado=last?Math.max(0,-diasPara(last)):null;
  return {st,env,dev,ree,rec,parado};
}

let XLSXP=null;
function loadXLSX(){ if(window.XLSX) return Promise.resolve(window.XLSX); if(XLSXP) return XLSXP; XLSXP=new Promise((ok,no)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload=()=>ok(window.XLSX); sc.onerror=()=>{XLSXP=null; no(new Error('xlsx'));}; document.head.appendChild(sc); }); return XLSXP; }
function csvRows(t){ const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':','; const out=[]; let row=[],cur='',q=false; for(let i=0;i<t.length;i++){ const ch=t[i]; if(q){ if(ch==='"'&&t[i+1]==='"'){cur+='"';i++;} else if(ch==='"') q=false; else cur+=ch; } else if(ch==='"') q=true; else if(ch===sep){row.push(cur);cur='';} else if(ch==='\n'){row.push(cur);out.push(row);row=[];cur='';} else if(ch!=='\r') cur+=ch; } if(cur||row.length){row.push(cur);out.push(row);} return out; }
function impParse(rows,cod,ini){
  const N=x=>semAcento(String(x??'')).toLowerCase(); let h=-1;
  for(let i=0;i<Math.min(rows.length,30);i++){ if(rows[i].some(c=>N(c).includes('entrega'))&&rows[i].some(c=>N(c).includes('qualitativa'))){ h=i; break; } }
  if(h<0) return {erro:'Não encontrei a linha de títulos (precisa ter as colunas ENTREGA e ANÁLISE QUALITATIVA, como na aba do órgão da planilha).'};
  const H=rows[h].map(N); const col=f=>H.findIndex(f);
  const cE=col(x=>x.startsWith('entrega')), cQl=col(x=>x.includes('qualitativa')), cQt=col(x=>x.includes('quantitativa')), cF=col(x=>x.includes('finalizada')), cD=col(x=>x.includes('data da analise'));
  const ok=[],ign=[],novas=[]; const ents=(EBO[cod]||[]).filter(e=>!ini||e.ini===ini);
  const cI=col(x=>x.startsWith('iniciativa')); let iniAt=null; let inst=null;
  rows.slice(0,h).forEach(r=>{ const i=r.findIndex(c=>N(c).trim()==='institucional'); if(i>-1){ const v=N(r[i+1]).trim(); if(v) inst=/parcial/.test(v)?'Parcial':/^ok|complet/.test(v)?'Completo':'Não preenchido'; } });
  const cn=v=>{ const m=String(v??'').replace(/\s+/g,' ').trim().match(/^(\d{3,6})\s*-?\s*(.*)$/); return m?[+m[1],m[2].trim()]:null; };
  rows.slice(h+1).forEach(r=>{ if(cI>-1){ const x=cn(r[cI]); if(x) iniAt=x; }
    const m=String(r[cE]??'').match(/(\d{4,6})/); if(!m) return; let e=ents.find(x=>x.cod===+m[1]);
    if(!e){ if(EBY[+m[1]]&&EBY[+m[1]].org!==cod){ ign.push(m[1]); return; } if(ini&&iniAt&&iniAt[0]!==ini){ ign.push(m[1]); return; }
      const nm=cn(r[cE])?.[1]||''; const ii=iniAt||[ini||0,'']; e=novas.find(x=>x.cod===+m[1]);
      if(!e){ e={cod:+m[1],nome:nm.toUpperCase(),org:cod,ini:ii[0],inome:String(ii[1]).toUpperCase(),prog:0,pnome:'',um:'',cls:'',tipo:'',acum:'N',estr:'',liq:0,saldo:0,fis:Array(12).fill(0),fin:Array(12).fill(0),stm:'',nloc:0,dini:'',dfim:'',origem:'planilha'}; novas.push(e); } }
    const ql=String(r[cQl]??'').trim(), qt=cQt>-1?String(r[cQt]??'').trim():'', fin=cF>-1&&/^(1|s|sim|x|ok)$/i.test(String(r[cF]??'').trim());
    if(ql||qt||fin) ok.push({e,ql,qt,fin,aj:fin&&!!ql&&!/\bok\b/i.test(ql)}); });
  return {ok,ign,novas,inst};
}

function prApply(){

function applyTheme(t){ try{ if(t) localStorage.setItem(THK,t); else t=localStorage.getItem(THK); }catch(e){} t=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); document.documentElement.dataset.theme=t; const b=document.getElementById('thBtn'); if(b){ b.innerHTML=t==='dark'?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>'; b.setAttribute('aria-pressed',t==='dark'); b.title=t==='dark'?'Modo claro':'Modo noturno'; } }
applyTheme();
try{ if(localStorage.getItem('gemonit-menu')==='min') document.documentElement.classList.add('side-min'); }catch(e){}
let GID=0;
const ST_COL={aguardando:'var(--faint)',analise:'#0056A0',devolvido:'#E0B800',reanalise:'var(--vio)',recebido:'var(--ok)',encerrado:'var(--faint)'};
const ring2=(p,s=56,c='var(--ink)')=>{ const r=(s-8)/2, C=2*Math.PI*r; return `<svg class="rg" width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" role="img" aria-label="${p}% analisado"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="var(--ring-bg)" stroke-width="6"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${s/2} ${s/2})"/><text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-size="${Math.round(s/4.3)}" font-weight="700" fill="currentColor">${p}%</text></svg>`; };
const gauge=(p,lab='analisado',w=200)=>{ const id='hz'+(++GID), L=Math.PI*80; return `<svg class="gauge" width="${w}" viewBox="0 0 200 116" role="img" aria-label="${p}% ${lab}"><defs><linearGradient id="${id}g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="var(--g-fg2,var(--g-fg))"/><stop offset="1" stop-color="var(--g-fg)"/></linearGradient><pattern id="${id}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--g-bg)"/><rect width="3" height="7" fill="var(--g-hatch)"/></pattern></defs><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#${id})" stroke-width="18" stroke-linecap="round"/><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="url(#${id}g)" stroke-width="18" stroke-linecap="round" stroke-dasharray="${(L*p/100).toFixed(1)} ${L.toFixed(1)}"/><text x="100" y="88" text-anchor="middle" font-size="34" font-weight="700" fill="currentColor" font-family="Space Grotesk, sans-serif">${p}%</text><text x="100" y="108" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${lab}</text></svg>`; };
function syncTop(){
  $('#cycSel').innerHTML=CICLOS.map(m=>`<option value="${m}" ${m===S.cyc?'selected':''}>${MESESL[m-1]}/${ANO}</option>`).join('');
  if(!S.sess) return;
  $('#usrBox').innerHTML=`${isGer()?`<span class="avatar" style="background:#009E3C;color:#fff">${ini(S.user)}</span>`:av(S.user)}<div class="un"><b>${esc(S.user)}</b><small>${{admin:'Administração',gerente:'Gerência',monitor:'Monitor',consulta:'Consulta'}[ME?.papel]||''}</small></div><button class="gbtn" data-act="logout" title="Sair do sistema">Sair</button>`;
}
$('#cycSel').addEventListener('change',e=>{ S.cyc=+e.target.value; render(true); });
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset&&t.dataset.instobs){ const c=S.ciclos[S.cyc][+t.dataset.instobs]; if(c&&c.instObs!==t.value){ const old=c.instObs||''; c.instObs=t.value; audit('ciclo',`${S.cyc}:${t.dataset.instobs}`,`${OB[+t.dataset.instobs].sig} · institucional`,'Edição',[{campo:'Comentário sobre o institucional',de:old,para:t.value,k:'instObs',v0:old}],+t.dataset.instobs); save(); } } });
document.addEventListener('change',e=>{ if(e.target.dataset&&e.target.dataset.act2==='swAn'){ location.hash='#analise-'+e.target.value; } });
document.addEventListener('change',e=>{ const d=e.target.dataset||{}; if(d.imp&&e.target.files[0]) impFile(e.target.files[0]); if(d.print&&e.target.files[0]) prFile(e.target.files[0]); if(d.anx&&e.target.files.length) anxAdd(d.anx,[...e.target.files]); });
document.addEventListener('input',e=>{ if(e.target.dataset&&e.target.dataset.anq){ ui.anq=e.target.value; const pos=e.target.selectionStart; render(true); const i=document.getElementById('anq'); if(i){ i.focus(); i.setSelectionRange(pos,pos);} } });
window.addEventListener('hashchange',()=>{ ui.openKey=null; const b=parse().base; if(b==='meus'||b==='consulta') ui.from=b; if((b==='orgao'||b==='analise')&&parse().a!==ui.lastOrg){ ui.ws.otab='pen'; if(!ui.keepSel){ ui.ws.atab='inst'; ui.iniSel=null; ui.asec='inst'; } ui.keepSel=false; ui.lastOrg=parse().a; } route(); });

index(); syncTop(); boot();
const _ft=document.getElementById('gfootLogo'); if(_ft) _ft.innerHTML=''; const _gl=document.getElementById('glogoMark'); if(_gl) _gl.innerHTML=LOGO_SGM(34);

</script>
